:root{
  --ink:#06070B; --txt:#F2F3F8; --mut:#8E93A6;
  --line:rgba(255,255,255,.10);
  --glass:rgba(255,255,255,.055); --glass2:rgba(255,255,255,.10);
  --violet:#7C6CFF; --teal:#3ED6B5; --rose:#FF5C77; --amber:#FFC46B;
  --r:26px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
html{overscroll-behavior-y:none;-webkit-text-size-adjust:100%}
body{overscroll-behavior-y:contain;touch-action:manipulation;user-select:none;-webkit-user-select:none}
#q{user-select:text;-webkit-user-select:text}
@media (display-mode:standalone){.wrap{padding-top:max(26px,env(safe-area-inset-top))}}
body{background:var(--ink);color:var(--txt);
  font-family:'Gyeonggi',-apple-system,BlinkMacSystemFont,"SF Pro Text","Pretendard","Apple SD Gothic Neo",system-ui,sans-serif;
  font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:-30%;z-index:-1;pointer-events:none;
  background:
    radial-gradient(38% 30% at 22% 12%, rgba(124,108,255,.38), transparent 70%),
    radial-gradient(34% 28% at 84% 24%, rgba(62,214,181,.22), transparent 70%),
    radial-gradient(40% 32% at 60% 92%, rgba(255,92,119,.14), transparent 70%);
  filter:blur(40px)}
.wrap{max-width:480px;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) 18px 110px}

.glass{background:linear-gradient(165deg,var(--glass2),var(--glass));
  backdrop-filter:blur(26px) saturate(170%);-webkit-backdrop-filter:blur(26px) saturate(170%);
  border:1px solid var(--line);border-radius:var(--r);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14), 0 24px 48px -28px rgba(0,0,0,.9)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.press{transition:transform .16s cubic-bezier(.2,.9,.3,1.4), background .18s, border-color .18s}
.press:active{transform:scale(.965)}

header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:6px 2px 22px}
h1.big{font-size:36px;line-height:1.04;letter-spacing:-.04em;font-weight:700;margin:0}
.hact{display:flex;align-items:center;gap:8px;flex:none}
.gear{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;color:var(--mut)}
.gear svg{width:21px;height:21px}
.setrow{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid rgba(255,255,255,.07)}
.setrow:last-child{border-bottom:0}
.setrow b{display:block;font-size:15.5px;font-weight:500;color:var(--txt)}
.setrow span{display:block;font-size:12.5px;color:var(--mut);margin-top:1px}
.seg{display:flex;gap:5px;margin-left:auto;flex:none}
.seg button{padding:8px 12px;border-radius:12px;font-size:13.5px;font-weight:500;color:var(--mut);background:rgba(255,255,255,.07);border:1px solid var(--line)}
.seg button.on{background:var(--txt);color:#0A0B10;border-color:transparent}
.fig{margin:14px 0;text-align:center}
.fig svg{max-width:100%;height:auto}
.fig span{display:block;font-size:12px;color:var(--mut);margin-top:4px}
.figrow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:12px 0}
.figrow .fig{margin:0}
h1.big em{display:block;font-style:normal;font-size:13px;font-weight:400;color:var(--mut);letter-spacing:0;margin-top:5px}
.pill{display:flex;gap:6px;align-items:center;padding:7px 13px;border-radius:999px;font-size:13.5px;font-weight:500;flex:none;margin-top:2px}
.pill.glass{border-radius:999px}
.flame{color:var(--amber)}
.sub{color:var(--mut);margin:16px 2px 14px;font-size:14.5px}

.sw{margin-left:auto;width:52px;height:31px;border-radius:99px;background:rgba(255,255,255,.14);position:relative;flex:none;transition:background .25s}
.sw i{position:absolute;top:3px;left:3px;width:25px;height:25px;border-radius:50%;background:#fff;transition:transform .3s cubic-bezier(.3,1.3,.5,1);box-shadow:0 2px 6px rgba(0,0,0,.45)}
.sw.on{background:var(--teal)} .sw.on i{transform:translateX(21px)}

.modes{display:flex;flex-direction:column;gap:12px}
.mode{display:flex;align-items:stretch;border-radius:22px;overflow:hidden;padding:0}
.mstart{flex:1;display:flex;align-items:center;gap:15px;padding:16px 10px 16px 17px;text-align:left;min-width:0}
.mstart .ic{width:46px;height:46px;flex:none;border-radius:15px;display:grid;place-items:center}
.mstart .ic svg{width:25px;height:25px}
.mstart .tt{display:block;font-weight:500;font-size:16px;letter-spacing:-.01em}
.mstart .ds{display:block;color:var(--mut);font-size:13.5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mstart .ds b{color:#C9CCDA;font-weight:500}
.qmark{width:54px;flex:none;border-left:1px solid var(--line);color:var(--mut);font-size:16px;font-weight:700}
.qmark:active{background:rgba(255,255,255,.08)}
.i1{background:rgba(124,108,255,.22);color:#B9B0FF}
.i2{background:rgba(62,214,181,.18);color:#7CE9D0}
.i3{background:rgba(255,196,107,.18);color:#FFD79B}
.i4{background:rgba(255,92,119,.18);color:#FF9DAF}
.i5{background:rgba(120,190,255,.18);color:#A8D6FF}
.i6{background:rgba(196,140,255,.18);color:#DDBBFF}

.topbar{display:flex;align-items:center;gap:14px;margin:4px 2px 20px}
.back{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;font-size:17px;flex:none}
.track{flex:1;height:7px;border-radius:99px;background:rgba(255,255,255,.09);overflow:hidden}
.fill{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--violet),var(--teal));transition:width .45s cubic-bezier(.3,1,.4,1)}
.count{font-size:13.5px;color:var(--mut);font-variant-numeric:tabular-nums;flex:none}

.qcard{padding:24px 20px 20px;text-align:center;margin-bottom:18px}
.qtag{font-size:13px;color:var(--mut);margin-bottom:12px}
.qmain{font-size:42px;font-weight:700;letter-spacing:-.045em;line-height:1.1;margin:2px 0 4px}
.qsub{color:var(--mut);font-size:14px;margin-top:6px}
.qnotes{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin-top:4px}
.qnotes i{font-style:normal;font-size:23px;font-weight:500;letter-spacing:-.02em;padding:6px 13px;border-radius:13px;background:rgba(255,255,255,.07);border:1px solid var(--line)}
.staff{display:block;width:100%;max-width:300px;height:auto;margin:16px auto 2px}
.staffwrap{margin-top:4px}

.hint{font-size:13.5px;color:var(--mut);text-align:center;margin:-4px 0 14px}
.opts{display:grid;gap:10px;padding-bottom:120px}
.opts.two{grid-template-columns:1fr 1fr}
.opts.three{grid-template-columns:repeat(3,1fr)}
.opt{padding:16px 12px;border-radius:19px;font-size:17px;font-weight:500;letter-spacing:-.015em;text-align:center}
.opt.sel{background:rgba(124,108,255,.28);border-color:rgba(124,108,255,.55)}
.opt.ok{background:rgba(62,214,181,.26);border-color:rgba(62,214,181,.6)}
.opt.no{background:rgba(255,92,119,.24);border-color:rgba(255,92,119,.55)}
.opt:disabled{cursor:default}

#scrim{position:fixed;inset:0;background:rgba(4,5,9,.55);backdrop-filter:blur(3px);z-index:35;opacity:0;pointer-events:none;transition:opacity .3s}
#scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:40;
  transform:translateY(105%);transition:transform .42s cubic-bezier(.32,1.2,.4,1);
  border-radius:30px 30px 0 0;border-bottom:0;
  padding:14px 20px calc(18px + env(safe-area-inset-bottom))}
.sheet.up{transform:translateY(0)}
.sheet .inner{max-width:480px;margin:0 auto}
.grab{width:38px;height:5px;border-radius:99px;background:rgba(255,255,255,.22);margin:0 auto 14px}
.verdict{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:700;letter-spacing:-.02em}
.verdict .dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:14px;flex:none;background:rgba(255,255,255,.14)}
.ok .dot{background:var(--teal);color:#04241D}
.no .dot{background:var(--rose);color:#3A0710}
.ok .verdict{color:#83EED6}
.no .verdict{color:#FF97AB}
.sheet.ok{border-top:1px solid rgba(62,214,181,.35);box-shadow:inset 0 1px 0 rgba(62,214,181,.22),0 -20px 60px -20px rgba(62,214,181,.22)}
.sheet.no{border-top:1px solid rgba(255,92,119,.35);box-shadow:inset 0 1px 0 rgba(255,92,119,.22),0 -20px 60px -20px rgba(255,92,119,.2)}
.expl{color:#C9CCDA;font-size:15.2px;line-height:1.62;margin:10px 0 14px;max-height:56vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.expl b{color:var(--txt);font-weight:500}
.expl code{font-family:inherit;background:rgba(255,255,255,.09);padding:1px 7px;border-radius:7px}
.expl table{width:100%;border-collapse:collapse;margin:10px 0 14px;font-size:13.8px}
.expl th{text-align:left;color:var(--mut);font-weight:400;padding:6px 9px;border-bottom:1px solid rgba(255,255,255,.14)}
.expl td{padding:6px 9px;border-bottom:1px solid rgba(255,255,255,.06);vertical-align:top}
.expl tr:last-child td{border-bottom:0}
.expl td:first-child{font-weight:700;color:var(--txt);white-space:nowrap}
.expl{scrollbar-width:thin}
.expl h4{margin:20px 0 6px;font-size:16px;color:var(--txt);font-weight:700;letter-spacing:-.015em}
.expl .lead{font-size:16.5px;color:var(--txt);font-weight:500;line-height:1.5;margin-bottom:4px}
.expl li b,.expl p b{color:#fff;font-weight:700}
.expl h4:first-child{margin-top:2px}
.expl p{margin:0 0 9px}
.expl ul{margin:0 0 9px;padding-left:17px}
.expl li{margin:4px 0}
.en{color:var(--mut);font-weight:400;font-size:.92em}
.next{width:100%;padding:16px;border-radius:19px;font-size:17px;font-weight:700;background:var(--txt);color:#0A0B10}

.ring{width:150px;height:150px;margin:6px auto 18px;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;font-size:38px;font-weight:700;letter-spacing:-.04em}
.rstats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}
.rstat{padding:15px;border-radius:19px;text-align:center}
.rstat b{display:block;font-size:22px;font-weight:700;letter-spacing:-.03em}
.rstat span{font-size:12.5px;color:var(--mut)}
.review{padding:16px 18px;border-radius:21px;margin-bottom:12px}
.review h3{margin:0 0 10px;font-size:14px;color:var(--mut);font-weight:500}
.review div{font-size:14px;padding:7px 0;border-top:1px solid rgba(255,255,255,.07)}
.review div:first-of-type{border:0}
.review em{font-style:normal;color:#FF97AB}

.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom));z-index:30;
  display:flex;gap:4px;padding:5px;border-radius:999px;max-width:min(420px,calc(100vw - 32px));
  overflow-x:auto;overflow-y:hidden;scrollbar-width:none;-webkit-overflow-scrolling:touch;scroll-behavior:smooth}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;white-space:nowrap}
.tabs button{padding:10px 24px;border-radius:999px;font-size:14px;font-weight:500;color:var(--mut);transition:background .2s,color .2s}
.tabs button.on{background:rgba(255,255,255,.14);color:var(--txt)}
.search{width:100%;padding:14px 17px;border-radius:18px;font-size:16px;color:var(--txt);margin-bottom:12px;outline:none}
.search::placeholder{color:var(--mut)}
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 2px 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;padding:8px 14px;border-radius:999px;font-size:14px;font-weight:500;color:var(--mut);background:rgba(255,255,255,.06);border:1px solid var(--line)}
.chips button.on{background:var(--txt);color:#0A0B10;border-color:transparent}
.clist{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;padding-bottom:120px}
.citem{padding:14px 8px;border-radius:16px;font-size:15px;font-weight:500;letter-spacing:-.02em;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.citem.on{background:rgba(124,108,255,.3);border-color:rgba(124,108,255,.55)}
.detail{padding:20px 18px;border-radius:24px;margin-bottom:16px}
.detail h2{margin:0;font-size:34px;font-weight:700;letter-spacing:-.045em;text-align:center}
.detail .kind{text-align:center;color:var(--mut);font-size:13.5px;margin-top:4px}
.dsec{margin-top:18px}
.dsec h5{margin:0 0 9px;font-size:12.5px;color:var(--mut);font-weight:500}
.tones{display:flex;gap:8px;flex-wrap:wrap}
.tone{padding:7px 12px;border-radius:13px;background:rgba(255,255,255,.07);border:1px solid var(--line);text-align:center;line-height:1.25}
.tone b{display:block;font-size:17px;font-weight:500;letter-spacing:-.02em}
.tone span{display:block;font-size:11px;color:var(--mut)}
.frets{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.frets::-webkit-scrollbar{display:none}
.fretcard{flex:none;padding:10px 6px 8px;border-radius:16px;background:rgba(255,255,255,.05);border:1px solid var(--line);text-align:center}
.fretcard svg{display:block}
.fretcard em{font-style:normal;font-size:11px;color:var(--mut);letter-spacing:.02em}
.tone.open{background:rgba(62,214,181,.18);border-color:rgba(62,214,181,.45)}
.tone.open b{color:#7CE9D0}
.chead{grid-column:1/-1;font-size:12.5px;color:var(--mut);font-weight:500;margin:10px 2px 0}
.chead:first-child{margin-top:0}
.chead b{color:#C9CCDA;font-weight:500}
.clist.two{grid-template-columns:repeat(2,1fr)}
.citem small{display:block;font-size:11px;color:var(--mut);font-weight:400;margin-top:2px}
.i7{background:rgba(255,160,120,.2);color:#FFC2A3}
.fretq{display:flex;justify-content:center;margin:16px 0 4px}
.fretq+.qsub{margin-top:18px}
.fretq svg{transform:scale(1.35);transform-origin:center}
.empty{color:var(--mut);font-size:14px;text-align:center;padding:26px 0}
/* ---------- 튜너 ---------- */
.tunerbox{position:relative;padding:22px 18px 18px;border-radius:26px;margin-bottom:14px}
.arcwrap{position:relative;width:100%;max-width:330px;margin:0 auto}
.arcwrap svg{display:block;width:100%;height:auto}
.tcenter{position:absolute;left:0;right:0;bottom:6px;text-align:center;pointer-events:none}
.tnote{font-size:76px;font-weight:700;letter-spacing:-.05em;line-height:.95;color:#E9EAF0}
.tnote small{font-size:.42em;vertical-align:.9em;margin-left:2px;font-weight:500}
.tnote.lock{color:var(--teal)}
.treads{display:flex;justify-content:center;gap:26px;margin-top:14px;font-size:14px;color:var(--mut);font-variant-numeric:tabular-nums}
.treads b{color:#C9CCDA;font-weight:500}
.strrow{display:flex;gap:8px;justify-content:center;margin:2px 0 14px;flex-wrap:wrap}
.strrow button{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.06);border:1px solid var(--line);font-size:15px;font-weight:500;color:var(--mut)}
.strrow button.near{background:rgba(62,214,181,.2);border-color:rgba(62,214,181,.5);color:#8BEFD8}
.refrow{display:flex;align-items:center;gap:12px;padding:13px 16px;border-radius:19px;margin-bottom:12px;font-size:14.5px}
.refrow .lb{color:var(--mut)}
.refrow .stepper{margin-left:auto;display:flex;align-items:center;gap:4px}
.refrow .stepper button{width:34px;height:34px;border-radius:11px;background:rgba(255,255,255,.08);border:1px solid var(--line);font-size:17px;font-weight:500;line-height:1}
.refrow b{min-width:58px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.tmsg{font-size:13.5px;color:var(--mut);text-align:center;margin-top:12px;line-height:1.55}
.tmsg:empty{display:none}
.diag{user-select:text;-webkit-user-select:text;text-align:left;font-size:11.5px;line-height:1.7;
  background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:10px 0 2px;color:#C9CCDA}
.retry{margin-top:10px;padding:11px 20px;border-radius:15px;background:rgba(255,255,255,.1);border:1px solid var(--line);color:var(--txt);font-size:14px;font-weight:500}

/* ---------- 메트로놈 ---------- */
.metrobox{padding:24px 18px 22px;border-radius:26px;margin-bottom:14px;text-align:center}
.dots{display:flex;gap:11px;justify-content:center;align-items:flex-start;flex-wrap:wrap;margin-bottom:14px}
.dots .beat{display:flex;flex-direction:column;align-items:center;gap:3px;padding:2px}
.dots i{display:block;width:19px;height:19px;border-radius:50%;background:rgba(62,214,181,.2);transition:background .06s,box-shadow .18s,transform .18s}
.dots i.s1{background:rgba(62,214,181,.42)}
.dots i.s2{background:rgba(62,214,181,.6)}
.dots i.on{background:#3CF3D0;box-shadow:0 0 20px 7px rgba(62,214,181,.5);transform:scale(1.15)}
.dots span{display:block;height:13px;font-size:14px;line-height:1;color:var(--teal);font-weight:700}
.sigrow{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.bpm{font-size:74px;font-weight:700;letter-spacing:-.05em;line-height:1;font-variant-numeric:tabular-nums}
.bpmlb{font-size:12.5px;color:var(--mut);letter-spacing:.14em;margin-top:2px}
.playbtn{width:72px;height:72px;border-radius:50%;margin:18px auto 0;display:grid;place-items:center;background:var(--txt);color:#0A0B10}
.playbtn svg{width:28px;height:28px}
.adjrow{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.adjrow button{padding:13px 0;border-radius:16px;font-size:15px;font-weight:500;font-variant-numeric:tabular-nums}
.slidebox{padding:14px 18px 10px;border-radius:19px;margin-bottom:12px}
.slidebox .mk{display:flex;justify-content:space-between;font-size:11.5px;color:var(--mut);margin-top:2px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:26px;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:99px;background:rgba(255,255,255,.14)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:#fff;margin-top:-9px;box-shadow:0 2px 8px rgba(0,0,0,.5)}
input[type=range]::-moz-range-track{height:6px;border-radius:99px;background:rgba(255,255,255,.14)}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border:0;border-radius:50%;background:#fff}
.mrow{display:flex;gap:10px;margin-bottom:12px}
.mrow>*{flex:1 1 0;min-width:0}
.tapbtn{padding:15px;border-radius:19px;font-size:15px;font-weight:500}
.soundbtn{display:flex;align-items:center;justify-content:center;gap:6px;padding:15px 12px;border-radius:19px;font-size:15px;font-weight:500}
.soundbtn .cr{width:9px;height:9px;flex:none;color:var(--mut);transition:transform .3s cubic-bezier(.3,1.3,.5,1),color .2s}
.soundbtn .nm{color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.soundbtn.open{border-color:rgba(62,214,181,.45);background:rgba(62,214,181,.12)}
.soundbtn.open .cr{transform:rotate(90deg);color:var(--teal)}
.soundbtn.open .nm{color:#7CE9D0}
#mSound{margin-bottom:12px;animation:drop .22s ease}
@keyframes drop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.sigrow{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.sigrow button{padding:12px 0;border-radius:15px;font-size:14px;font-weight:500;color:var(--mut);background:rgba(255,255,255,.06);border:1px solid var(--line)}
.sigrow button.on{background:var(--txt);color:#0A0B10;border-color:transparent}
.ordrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.07)}
.ordrow:last-child{border-bottom:0}
.ordrow b{font-weight:500;font-size:15px}
.ordrow .mv{margin-left:auto;display:flex;gap:6px}
.ordrow .mv button{width:34px;height:34px;border-radius:11px;background:rgba(255,255,255,.08);border:1px solid var(--line);font-size:14px;color:var(--txt)}
.ordrow .mv button:disabled{opacity:.3}
.tabs button{padding:10px 16px}

/* ---------- 태블릿 · 가로 모드 ---------- */
@media (orientation:landscape) and (min-width:700px){
  .wrap{max-width:1000px;padding-bottom:104px}

  #home{display:grid;grid-template-columns:1fr 1fr;gap:12px 20px;align-items:start}
  #home header{grid-column:1/-1}
  .modes{display:contents}
  .mode{margin:0}

  #quiz{display:grid;grid-template-columns:1.05fr .95fr;gap:10px 22px;align-items:start}
  .topbar{grid-column:1/-1}
  .qcard{grid-column:1;grid-row:2/6;margin-bottom:0;position:sticky;top:8px}
  .hint{grid-column:2;margin:0 0 8px}
  .opts{grid-column:2;padding-bottom:0}

  #result{display:grid;grid-template-columns:.85fr 1.15fr;gap:8px 24px;align-items:center}
  #result header{grid-column:1/-1}
  .ring{grid-column:1;grid-row:2/5;margin:0 auto}
  #rtitle{grid-column:2}
  .rstats{grid-column:2;margin:12px 0}
  .review{grid-column:2}
  .rbtns{grid-column:2}

  #tuner{display:grid;grid-template-columns:1.15fr .85fr;gap:12px 22px;align-items:start}
  #tuner header{grid-column:1/-1}
  .tunerbox{grid-column:1;grid-row:2/7;margin-bottom:0}
  #tInst,.strrow,.refrow,.tmsg{grid-column:2}
  .strrow{margin:2px 0 12px}
  .tmsg{margin-top:4px}

  #metro{display:grid;grid-template-columns:1.05fr .95fr;gap:12px 22px;align-items:start}
  #metro header{grid-column:1/-1}
  .metrobox{grid-column:1;grid-row:2;margin-bottom:0}
  .adjrow{grid-column:1;grid-row:3}
  .mrow2{grid-column:1;grid-row:4}
  #mSound{grid-column:1;grid-row:5;margin-bottom:0}
  #mSig{grid-column:2;grid-row:2}

  #dict{display:grid;grid-template-columns:1.05fr .95fr;gap:12px 22px;align-items:start}
  #dict header{grid-column:1/-1}
  #detail{grid-column:1;grid-row:2/6;position:sticky;top:8px}
  #detail:empty::after{content:"왼쪽에 코드가 표시됩니다";display:block;padding:40px 0;text-align:center;color:var(--mut);font-size:14px;border:1px dashed var(--line);border-radius:24px}
  #q,#roots,#clist{grid-column:2}
  .clist{padding-bottom:20px}

  .sheet{border-radius:26px 26px 0 0}
  .sheet .inner{max-width:860px}
  .expl{max-height:46vh}
  .metrobox{padding:26px 18px}
  .bpm{font-size:88px}
  .tnote{font-size:88px}
}
@media (orientation:landscape) and (min-width:700px) and (max-height:520px){
  .expl{max-height:38vh}
  .bpm,.tnote{font-size:64px}
  .ring{width:120px;height:120px}
}
.hidden{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
:focus-visible{outline:2px solid var(--violet);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">

<section id="home">
  <header>
    <h1 class="big">Harmony<br>Trainer</h1>
    <div class="hact">
      <div class="pill glass"><span class="flame">●</span><span id="streak">0</span></div>
      <button class="gear glass press" onclick="settings()" aria-label="설정">
        <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3.1" stroke="currentColor" stroke-width="1.8"/><path d="M12 2.6l1.5 2.2 2.6-.5.5 2.6 2.2 1.5-1.3 2.3 1.3 2.3-2.2 1.5-.5 2.6-2.6-.5L12 21.4l-1.5-2.2-2.6.5-.5-2.6-2.2-1.5 1.3-2.3-1.3-2.3 2.2-1.5.5-2.6 2.6.5z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </header>
  <div class="modes" id="modeList"></div>
</section>

<section id="quiz" class="hidden">
  <div class="topbar">
    <button class="back glass press" onclick="go('home')" aria-label="뒤로">←</button>
    <div class="track"><div class="fill" id="fill"></div></div>
    <div class="count" id="count">1/10</div>
  </div>
  <div class="qcard glass" id="qcard"></div>
  <div class="hint" id="hint"></div>
  <div class="opts" id="opts"></div>
</section>

<section id="result" class="hidden">
  <header><h1 class="big">Result<em id="rmode"></em></h1></header>
  <div class="ring">
    <svg width="150" height="150">
      <circle cx="75" cy="75" r="66" stroke="rgba(255,255,255,.08)" stroke-width="11" fill="none"/>
      <circle id="arc" cx="75" cy="75" r="66" stroke="url(#g)" stroke-width="11" fill="none" stroke-linecap="round" stroke-dasharray="415" stroke-dashoffset="415" style="transition:stroke-dashoffset 1s cubic-bezier(.3,1,.4,1)"/>
      <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7C6CFF"/><stop offset="1" stop-color="#3ED6B5"/></linearGradient></defs>
    </svg>
    <div class="num" id="rnum">0</div>
  </div>
  <div style="text-align:center;color:var(--mut);font-size:14px" id="rtitle"></div>
  <div class="rstats">
    <div class="rstat glass"><b id="rAcc">0%</b><span>정확도</span></div>
    <div class="rstat glass"><b id="rStreak">0</b><span>최고 연속</span></div>
  </div>
  <div class="review glass hidden" id="review"><h3>다시 볼 문제</h3><div id="reviewList"></div></div>
  <div class="rbtns" style="display:grid;gap:10px;margin-top:6px">
    <button class="next press" id="again">한 번 더</button>
    <button class="opt glass press" onclick="go('home')">다른 모드 고르기</button>
  </div>
</section>

<section id="tuner" class="hidden">
  <header>
    <h1 class="big">Tuner</h1>
    <div class="hact">
      <button class="gear glass press" onclick="settings()" aria-label="설정">
        <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3.1" stroke="currentColor" stroke-width="1.8"/><path d="M12 2.6l1.5 2.2 2.6-.5.5 2.6 2.2 1.5-1.3 2.3 1.3 2.3-2.2 1.5-.5 2.6-2.6-.5L12 21.4l-1.5-2.2-2.6.5-.5-2.6-2.2-1.5 1.3-2.3-1.3-2.3 2.2-1.5.5-2.6 2.6.5z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </header>
  <div class="tunerbox glass">
    <div class="arcwrap">
      <svg viewBox="0 0 320 196" aria-hidden="true">
        <path id="tTri" d="M160 16 l7 11 h-14 z" fill="rgba(255,255,255,.25)"/>
        <path d="M40 176 A 120 120 0 0 1 280 176" fill="none" stroke="rgba(255,255,255,.16)" stroke-width="3" stroke-linecap="round"/>
        <path id="tArcLive" d="M40 176 A 120 120 0 0 1 280 176" fill="none" stroke="rgba(255,255,255,.05)" stroke-width="3"/>
        <circle id="tDot" cx="160" cy="56" r="11" fill="rgba(255,255,255,.35)"/>
        <text x="30" y="182" font-size="26" fill="rgba(255,255,255,.45)" text-anchor="middle">♭</text>
        <text x="292" y="182" font-size="26" fill="rgba(255,255,255,.45)" text-anchor="middle">♯</text>
      </svg>
      <div class="tcenter"><div class="tnote" id="tNote">–</div></div>
    </div>
    <div class="treads"><span>HZ <b id="tHz">—</b></span><span><b id="tCent">—</b> cents</span></div>
  </div>
  <div class="sigrow" id="tInst" style="margin-bottom:12px"></div>
  <div class="strrow" id="tStrings"></div>
  <div class="refrow glass">
    <span class="lb">기준음 A4</span>
    <div class="stepper">
      <button class="press" onclick="tRef(-1)">−</button>
      <b id="tRefV">440</b><span class="lb">Hz</span>
      <button class="press" onclick="tRef(1)">+</button>
    </div>
  </div>
  <div class="tmsg" id="tMsg"></div>
</section>

<section id="metro" class="hidden">
  <header>
    <h1 class="big">Metronome</h1>
    <div class="hact">
      <button class="gear glass press" onclick="settings()" aria-label="설정">
        <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3.1" stroke="currentColor" stroke-width="1.8"/><path d="M12 2.6l1.5 2.2 2.6-.5.5 2.6 2.2 1.5-1.3 2.3 1.3 2.3-2.2 1.5-.5 2.6-2.6-.5L12 21.4l-1.5-2.2-2.6.5-.5-2.6-2.2-1.5 1.3-2.3-1.3-2.3 2.2-1.5.5-2.6 2.6.5z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </header>
  <div class="metrobox glass">
    <div class="dots" id="mDots"></div>
    <div class="bpm" id="mBpm">120</div>
    <div class="bpmlb">BPM</div>
    <button class="playbtn press" id="mPlay" onclick="toggleMetro()" aria-label="재생">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg>
    </button>
  </div>
  <div class="adjrow">
    <button class="glass press" onclick="mAdd(-10)">−10</button>
    <button class="glass press" onclick="mAdd(-5)">−5</button>
    <button class="glass press" onclick="mAdd(5)">+5</button>
    <button class="glass press" onclick="mAdd(10)">+10</button>
  </div>
  <div class="mrow2">
    <div class="slidebox glass">
      <input type="range" id="mSlider" min="30" max="300" value="120" step="1" aria-label="템포">
      <div class="mk"><span>30</span><span id="mTempoWord">Moderato</span><span>300</span></div>
    </div>
    <div class="mrow">
      <button class="soundbtn glass press" id="mSoundBtn" onclick="toggleSoundPanel()" aria-expanded="false" aria-controls="mSound" aria-label="음색 선택">
        <svg class="cr" viewBox="0 0 10 10" aria-hidden="true"><path d="M3 1.2 L8 5 L3 8.8 Z" fill="currentColor"/></svg>
        <span>Sound</span><span class="nm" id="mSoundName">Click</span>
      </button>
      <button class="tapbtn glass press" id="mTap" onclick="tapTempo()">Tap Tempo</button>
    </div>
  </div>
  <div class="sigrow hidden" id="mSound"></div>
  <div class="sigrow" id="mSig"></div>
</section>

<section id="dict" class="hidden">
  <header><h1 class="big">Chord Library</h1>
    <div class="hact"><button class="gear glass press" onclick="settings()" aria-label="설정">
      <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3.1" stroke="currentColor" stroke-width="1.8"/><path d="M12 2.6l1.5 2.2 2.6-.5.5 2.6 2.2 1.5-1.3 2.3 1.3 2.3-2.2 1.5-.5 2.6-2.6-.5L12 21.4l-1.5-2.2-2.6.5-.5-2.6-2.2-1.5 1.3-2.3-1.3-2.3 2.2-1.5.5-2.6 2.6.5z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
    </button></div>
  </header>
  <input id="q" class="search glass" placeholder="코드 검색" autocomplete="off" autocapitalize="off" spellcheck="false">
  <div class="chips" id="roots"></div>
  <div id="detail"></div>
  <div class="clist" id="clist"></div>
</section>

<script>
/* ============ 음악 이론 엔진 ============ */
const L=['C','D','E','F','G','A','B'], BASE=[0,2,4,5,7,9,11], PERF=[0,3,4];
const accStr=a=>a===0?'':a>0?'♯'.repeat(a):'♭'.repeat(-a);
const nm=n=>L[n.l]+accStr(n.a);
const pc=n=>((BASE[n.l]+n.a)%12+12)%12;
const P=s=>{const m=/^([A-G])(♯|♭)?$/.exec(s);return{l:L.indexOf(m[1]),a:m[2]==='♯'?1:m[2]==='♭'?-1:0}};
function ivSemi(num,q){
  const s=(num-1)%7,oct=(num-1-s)/7;
  const d=PERF.includes(s)?{P:0,A:1,d:-1}[q]:{M:0,m:-1,A:1,d:-2}[q];
  return BASE[s]+d+12*oct;
}
function addIv(r,num,q){
  const s=(num-1)%7,l=(r.l+s)%7;
  const t=((pc(r)+ivSemi(num,q))%12+12)%12;
  let a=((t-BASE[l])%12+12)%12; if(a>6)a-=12;
  return {l,a};
}
function ivBetween(a,b){
  const ld=((b.l-a.l)%7+7)%7,num=ld+1;
  const sem=((pc(b)-pc(a))%12+12)%12;
  let d=sem-BASE[ld]; if(d>6)d-=12; if(d<-6)d+=12;
  const q=PERF.includes(ld)?{0:'P',1:'A','-1':'d',2:'AA','-2':'dd'}[d]
                           :{0:'M','-1':'m',1:'A','-2':'d',2:'AA','-3':'dd'}[d];
  return {num,q};
}
const QK={P:'완전',M:'장',m:'단',A:'증',d:'감',AA:'겹증',dd:'겹감'};
const ivKo=i=>QK[i.q]+i.num+'도';

const CH={
  maj   :{sym:'',       ko:'메이저 3화음',      iv:[[1,'P'],[3,'M'],[5,'P']]},
  min   :{sym:'m',      ko:'마이너 3화음',      iv:[[1,'P'],[3,'m'],[5,'P']]},
  dim   :{sym:'dim',    ko:'디미니시드 3화음',  iv:[[1,'P'],[3,'m'],[5,'d']]},
  aug   :{sym:'aug',    ko:'어그멘티드 3화음',  iv:[[1,'P'],[3,'M'],[5,'A']]},
  sus4  :{sym:'sus4',   ko:'서스4',             iv:[[1,'P'],[4,'P'],[5,'P']]},
  sus2  :{sym:'sus2',   ko:'서스2',             iv:[[1,'P'],[2,'M'],[5,'P']]},
  maj7  :{sym:'maj7',   ko:'메이저 7th',        iv:[[1,'P'],[3,'M'],[5,'P'],[7,'M']]},
  dom7  :{sym:'7',      ko:'도미넌트 7th',      iv:[[1,'P'],[3,'M'],[5,'P'],[7,'m']]},
  min7  :{sym:'m7',     ko:'마이너 7th',        iv:[[1,'P'],[3,'m'],[5,'P'],[7,'m']]},
  m7b5  :{sym:'m7♭5',   ko:'하프 디미니시드',   iv:[[1,'P'],[3,'m'],[5,'d'],[7,'m']]},
  dim7  :{sym:'dim7',   ko:'디미니시드 7th',    iv:[[1,'P'],[3,'m'],[5,'d'],[7,'d']]},
  mMaj7 :{sym:'m(maj7)',ko:'마이너 메이저 7th', iv:[[1,'P'],[3,'m'],[5,'P'],[7,'M']]},
  six   :{sym:'6',      ko:'메이저 6th',        iv:[[1,'P'],[3,'M'],[5,'P'],[6,'M']]},
  m6    :{sym:'m6',     ko:'마이너 6th',        iv:[[1,'P'],[3,'m'],[5,'P'],[6,'M']]},
  add9  :{sym:'add9',   ko:'애드9 (7음 없음)',  iv:[[1,'P'],[3,'M'],[5,'P'],[9,'M']]},
  madd9 :{sym:'m(add9)',ko:'마이너 애드9',      iv:[[1,'P'],[3,'m'],[5,'P'],[9,'M']]},
  six9  :{sym:'6/9',    ko:'식스나인',          iv:[[1,'P'],[3,'M'],[5,'P'],[6,'M'],[9,'M']]},
  maj9  :{sym:'maj9',   ko:'메이저 9th',        iv:[[1,'P'],[3,'M'],[5,'P'],[7,'M'],[9,'M']]},
  dom9  :{sym:'9',      ko:'도미넌트 9th',      iv:[[1,'P'],[3,'M'],[5,'P'],[7,'m'],[9,'M']]},
  min9  :{sym:'m9',     ko:'마이너 9th',        iv:[[1,'P'],[3,'m'],[5,'P'],[7,'m'],[9,'M']]},
  min11 :{sym:'m11',    ko:'마이너 11th',       iv:[[1,'P'],[3,'m'],[7,'m'],[9,'M'],[11,'P']],omit:'5음 생략'},
  maj7s11:{sym:'maj7(♯11)',ko:'리디안 사운드',  iv:[[1,'P'],[3,'M'],[5,'P'],[7,'M'],[11,'A']]},
  dom13 :{sym:'13',     ko:'도미넌트 13th',     iv:[[1,'P'],[3,'M'],[7,'m'],[9,'M'],[13,'M']],omit:'5·11음 생략'},
  dom7b9:{sym:'7(♭9)',  ko:'플랫나인',          iv:[[1,'P'],[3,'M'],[5,'P'],[7,'m'],[9,'m']]},
  dom7s9:{sym:'7(♯9)',  ko:'샵나인',            iv:[[1,'P'],[3,'M'],[5,'P'],[7,'m'],[9,'A']]},
  dom7s11:{sym:'7(♯11)',ko:'샵일레븐',          iv:[[1,'P'],[3,'M'],[7,'m'],[9,'M'],[11,'A']],omit:'5음 생략'},
  dom7b13:{sym:'7(♭13)',ko:'플랫써틴',          iv:[[1,'P'],[3,'M'],[7,'m'],[9,'M'],[13,'m']],omit:'5음 생략'},
  five  :{sym:'5',      ko:'파워코드 (근음+5음)',iv:[[1,'P'],[5,'P']]},
  sus2a13:{sym:'sus2(add13)',ko:'서스2 + 13',   iv:[[1,'P'],[2,'M'],[5,'P'],[6,'M']]},
  sus2a11:{sym:'sus2(add11)',ko:'서스2 + 11',   iv:[[1,'P'],[2,'M'],[4,'P'],[5,'P']]},
  add11 :{sym:'add11',  ko:'애드11',             iv:[[1,'P'],[3,'M'],[5,'P'],[11,'P']]},
  madd11:{sym:'m(add11)',ko:'마이너 애드11',     iv:[[1,'P'],[3,'m'],[5,'P'],[11,'P']]},
  m7add11:{sym:'m7(add11)',ko:'마이너7 + 11',    iv:[[1,'P'],[3,'m'],[5,'P'],[7,'m'],[11,'P']]},
  dom7add11:{sym:'7(add11)',ko:'도미넌트7 + 11', iv:[[1,'P'],[3,'M'],[5,'P'],[7,'m'],[11,'P']]},
  dom7sus4:{sym:'7sus4',ko:'도미넌트7 서스4',    iv:[[1,'P'],[4,'P'],[5,'P'],[7,'m']]},
  m7b13 :{sym:'m7(♭13)',ko:'마이너7 + ♭13',     iv:[[1,'P'],[3,'m'],[5,'P'],[7,'m'],[13,'m']]},
  maj7a13:{sym:'maj7(add13)',ko:'메이저7 + 13',  iv:[[1,'P'],[3,'M'],[5,'P'],[6,'M'],[7,'M']]}
};
const symOf=(root,k)=>root+CH[k].sym;
const tonesOf=(root,k)=>CH[k].iv.map(([n,q])=>nm(addIv(P(root),n,q)));
const clean=(root,k)=>CH[k].iv.every(([n,q])=>Math.abs(addIv(P(root),n,q).a)<=1);

const NOTE_RE=/^[A-G](♯|♭)?$/;
const ROOTS=['C','D♭','D','E♭','E','F','F♯','G','A♭','A','B♭','B'];
const EASY=['C','D','E','F','G','A','B♭','E♭'];
const MINKEYS=['A','E','D','G','C','B','F♯','F','B♭'];
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const shuf=a=>a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(v=>v[1]);
const uniq=a=>[...new Set(a)];
function pickRoot(pool,keys){let r,t=0;do{r=rnd(pool);t++}while(!keys.every(k=>clean(r,k))&&t<40);return r}

const degLabel=(num,q)=>{
  const s=(num-1)%7;
  if(num===1)return 'R';
  if(PERF.includes(s))return (q==='A'?'♯':q==='d'?'♭':'')+num;
  return (q==='m'?'♭':q==='A'?'♯':q==='d'?'♭♭':'')+num;
};

/* ---- 오선보 좌표: step 0 = C4(가온다), 1step = 온음계 한 칸 ---- */
function pickBase(l,span){
  return [l-7,l,l+7].reduce((best,b)=>
    Math.abs(b+span/2-6)<Math.abs(best+span/2-6)?b:best);
}
function chordSteps(rootName,ivList,hlNums){
  const r=P(rootName);
  const maxNum=Math.max(...ivList.map(x=>x[0]));
  const base=pickBase(r.l,maxNum-1);
  return ivList.map(([n,q])=>{
    const o=addIv(r,n,q);
    return {l:o.l,a:o.a,step:base+(n-1),hl:hlNums?hlNums.includes(n):false};
  });
}

/* ============ 문제 생성기 ============ */
const G={};

G.build=()=>{
  const pool=['maj','min','dim','aug','sus4','maj7','dom7','min7','m7b5','dim7','six','add9','madd9','mMaj7','maj9','dom9','min9','dom7b9','dom7s9','min11','dom13','dom7s11','six9','maj7s11','dom7b13','sus2','m6',
    'add11','madd11','m7add11','dom7add11','dom7sus4','sus2a13','m7b13','maj7a13','five'];
  let k,root,t=0;
  do{k=rnd(pool);root=rnd(ROOTS);t++}while(!clean(root,k)&&t<60);
  const ans=tonesOf(root,k), distr=[];
  const cand=[[2,'M'],[3,'m'],[3,'M'],[4,'P'],[5,'d'],[5,'P'],[5,'A'],[6,'M'],[7,'m'],[7,'M'],[9,'m'],[9,'A'],[11,'A'],[13,'m']];
  shuf(cand).forEach(([n,q])=>{
    const o=addIv(P(root),n,q), x=nm(o);
    if(!ans.includes(x)&&!distr.includes(x)&&Math.abs(o.a)<=1&&distr.length<5)distr.push(x);
  });
  const map=CH[k].iv.map(([n,q])=>degLabel(n,q)+'='+nm(addIv(P(root),n,q))).join(' · ');
  const full=chordSteps(root,CH[k].iv);
  return{
    type:'multi', need:ans.length, answer:ans, options:shuf(uniq([...ans,...distr])),
    tag:'구성음 고르기', main:symOf(root,k), sub:CH[k].omit||'',
    hint:ans.length+'개 선택',
    staff:[[full[0]]],
    staffAns:[full],
    expl:`<b>${symOf(root,k)}</b> = ${map}`+(CH[k].omit?`<br>${CH[k].omit} — 네 손가락 안에 담기 위해 생략합니다.`:'')
  };
};

G.interval=()=>{
  const roots=['C','D','E','F','G','A','B','B♭','E♭','F♯','A♭','D♭'];
  const set=[[2,'m'],[2,'M'],[3,'m'],[3,'M'],[4,'P'],[4,'A'],[5,'d'],[5,'P'],[5,'A'],[6,'m'],[6,'M'],[7,'m'],[7,'M'],[8,'P'],[2,'A'],[7,'d'],[3,'d'],[6,'A']];
  let a,b,iv,num;
  do{
    a=P(rnd(roots)); const sp=rnd(set); num=sp[0]; b=addIv(a,sp[0],sp[1]); iv=ivBetween(a,b);
  }while(Math.abs(b.a)>1||!QK[iv.q]);
  const correct=ivKo(iv);
  const semi=((pc(b)-pc(a))%12+12)%12;
  // 오답: ① 같은 반음 수의 다른 표기 ② 도수는 같고 음질만 다름 ③ 도수 ±1
  const cand=[];
  const push=(n,q)=>{if(QK[q]){const t=QK[q]+n+'도'; if(t!==correct&&!cand.includes(t))cand.push(t)}};
  set.forEach(([n,q])=>{const sm=((ivSemi(n,q)%12)+12)%12; if(sm===semi)push(n,q)});     // 이명동음 함정
  const fam=PERF.includes((iv.num-1)%7)?['P','A','d']:['M','m','A','d'];
  fam.forEach(q=>push(iv.num,q));                                                        // 음질만 다른 함정
  [iv.num-1,iv.num+1].forEach(n=>{if(n>=1&&n<=8)fam.forEach(q=>push(n,q))});             // 도수 한 칸 차이
  const opts=shuf(uniq([correct,...shuf(cand).slice(0,3)]));
  return{
    type:'single', answer:correct, options:opts,
    tag:'음정은?', notes:[nm(a),nm(b)],
    staff:[[{l:a.l,a:a.a,step:pickBase(a.l,num-1)}],[{l:b.l,a:b.a,step:pickBase(a.l,num-1)+num-1}]],
    expl:`${nm(a)}에서 ${nm(b)}까지 알파벳은 <code>${L[a.l]}→${L[b.l]}</code>로 <b>${iv.num}도</b>, 반음은 <b>${semi===0&&num===8?12:semi}개</b> → <b>${correct}</b>.<br>같은 반음 수라도 알파벳 개수가 다르면 도수가 달라집니다.`
  };
};

G.tension=()=>{
  const mode=rnd(['find','name','avoid','addvs']);
  if(mode==='find'){
    let base,root,tn,obj,guard=0;
    do{
      base=rnd(['dom7','maj7','min7']);
      root=pickRoot(ROOTS,[base]);
      tn=rnd(base==='dom7'?[[9,'m'],[9,'M'],[9,'A'],[11,'A'],[13,'m'],[13,'M']]
          :base==='maj7'?[[9,'M'],[11,'A'],[13,'M']]:[[9,'M'],[11,'P'],[13,'M']]);
      obj=addIv(P(root),tn[0],tn[1]);
    }while(Math.abs(obj.a)>1&&++guard<50);
    const note=nm(obj), lab=degLabel(tn[0],tn[1]);
    const all=['♭9','9','♯9','11','♯11','♭13','13'];
    const near=all.filter(x=>x!==lab&&x.replace(/[♭♯]/,'')===lab.replace(/[♭♯]/,''));
    const others=shuf(all.filter(x=>x!==lab&&!near.includes(x)));
    let opts=shuf(uniq([lab,...near,...others]).slice(0,4));
    const iv2=CH[base].iv.concat([tn]);
    return{type:'single',answer:lab,options:shuf(opts),
      tag:`${symOf(root,base)}에서 이 음은?`, main:note,
      staff:[chordSteps(root,iv2,[tn[0]])],
      expl:`${root}에서 ${note}까지는 <b>${ivKo(ivBetween(P(root),obj))}</b>, 한 옥타브 위로 올려 세면 <b>${lab}</b>입니다.<br>9=2도, 11=4도, 13=6도를 옥타브 위로 올린 이름입니다.`};
  }
  if(mode==='name'){
    const k=rnd(['dom7b9','dom7s9','dom7s11','dom7b13','maj9','min9','dom13','min11','maj7s11','add9']);
    const root=pickRoot(ROOTS,[k]);
    const spec=CH[k].iv[CH[k].iv.length-1];
    const note=nm(addIv(P(root),spec[0],spec[1])), lab=degLabel(spec[0],spec[1]);
    const s0=(spec[0]-1)%7;
    const flip=PERF.includes(s0)?(spec[1]==='P'?'A':'P'):(spec[1]==='M'?'m':'M');
    const near=[nm(addIv(P(root),spec[0],flip)),nm(addIv(P(root),spec[0]===9?13:9,'M')),
                nm(addIv(P(root),5,'P')),nm(addIv(P(root),7,'m')),nm(addIv(P(root),6,'M'))];
    const opts=shuf(uniq([note,...near.filter(x=>x!==note&&NOTE_RE.test(x))])).slice(0,4);
    const full=chordSteps(root,CH[k].iv,[spec[0]]);
    return{type:'single',answer:note,options:opts.includes(note)?shuf(opts):shuf([note,...opts.slice(0,3)]),
      tag:`이 코드의 ${lab} 음은?`, main:symOf(root,k), sub:CH[k].omit||'',
      staff:[full.filter(n=>!n.hl)],
      staffAns:[full],
      expl:`${root}의 ${lab}은 <b>${note}</b>. 근음에서 ${ivKo(ivBetween(P(root),addIv(P(root),spec[0],spec[1])))} 위(옥타브 포함)입니다.`};
  }
  if(mode==='avoid'){
    const cases=[
      {q:'Cmaj7',k:['C','maj7'],a:'F (11)',o:['F (11)','D (9)','A (13)','B (7음)'],e:'메이저 7th에서 완전11도(F)는 3음 E와 단9도로 부딪혀 <b>어보이드 노트</b>입니다. ♯11로 올리면 리디안 사운드가 되어 사용 가능합니다.'},
      {q:'G7',k:['G','dom7'],a:'C (11)',o:['C (11)','A (9)','E (13)','F (7음)'],e:'도미넌트 7th의 완전11도(C)는 3음 B와 충돌하는 <b>어보이드 노트</b>. ♯11은 사용 가능합니다.'},
      {q:'Em7 (C장조의 IIIm7)',k:['E','min7'],a:'C (♭13)',o:['C (♭13)','F♯ (9)','A (11)','D (7음)'],e:'IIIm7 위의 ♭13(C)은 5음 B와 단9도로 부딪혀 <b>어보이드</b>. 같은 마이너라도 IIm7은 9·11·13을 자유롭게 씁니다.'},
      {q:'Dm7 (C장조의 IIm7)',k:['D','min7'],a:'어보이드 없음',o:['어보이드 없음','E (9)','G (11)','B (13)'],e:'IIm7은 9·11·13 어느 것도 화음음과 단9도를 만들지 않아 <b>어보이드 노트가 없습니다</b>. 텐션을 가장 자유롭게 얹을 수 있는 코드죠.'}
    ];
    const c=rnd(cases);
    return{type:'single',answer:c.a,options:shuf(c.o),tag:'어보이드 노트는?',main:c.q,
      staff:[chordSteps(c.k[0],CH[c.k[1]].iv)],
      staffAns:[chordSteps(c.k[0],CH[c.k[1]].iv)],expl:c.e};
  }
  const root=pickRoot(EASY,['add9','maj9']);
  const which=rnd([0,1]);
  const q=which?symOf(root,'maj9'):symOf(root,'add9');
  return{type:'single',answer:which?'7음이 있다':'7음이 없다',
    options:shuf(['7음이 있다','7음이 없다','3음이 없다','5음이 반드시 있다']),
    tag:'이 코드의 특징은?', main:q,
    staff:[chordSteps(root,CH[which?'maj9':'add9'].iv)],
    staffAns:[chordSteps(root,CH[which?'maj9':'add9'].iv)],
    expl:`<b>add9</b>는 3화음에 9음만 얹습니다 → ${tonesOf(root,'add9').join(' ')} (7음 없음).<br><b>maj9</b>는 7음을 포함합니다 → ${tonesOf(root,'maj9').join(' ')}.<br>9th 코드는 7음이 있어야 성립하고, add는 7음을 건너뜁니다.`};
};

const MAJ_DIA=[['maj7','Imaj7'],['min7','IIm7'],['min7','IIIm7'],['maj7','IVmaj7'],['dom7','V7'],['min7','VIm7'],['m7b5','VIIm7♭5']];
const MAJ_STEP=[[1,'P'],[2,'M'],[3,'M'],[4,'P'],[5,'P'],[6,'M'],[7,'M']];
const MIN_DIA=[['min7','Im7'],['m7b5','IIm7♭5'],['maj7','♭IIImaj7'],['min7','IVm7'],['min7','Vm7'],['maj7','♭VImaj7'],['dom7','♭VII7']];
const MIN_STEP=[[1,'P'],[2,'M'],[3,'m'],[4,'P'],[5,'P'],[6,'m'],[7,'m']];
G.diatonic=()=>{
  const minor=Math.random()<.45;
  const keyRoot=rnd(minor?MINKEYS:EASY);
  const dia=minor?MIN_DIA:MAJ_DIA, step=minor?MIN_STEP:MAJ_STEP;
  const i=Math.floor(Math.random()*7);
  const deg=nm(addIv(P(keyRoot),step[i][0],step[i][1]));
  const harmonic=minor&&i===4&&Math.random()<.6;
  const kind=harmonic?'dom7':dia[i][0];
  const roman=harmonic?'V7 (화성단조)':dia[i][1];
  const chord=symOf(deg,kind);
  const romans=dia.map(d=>d[1]);
  const sameKind=romans.filter((r,j)=>j!==i&&dia[j][0]===dia[i][0]);
  const rest=shuf(romans.filter(r=>r!==dia[i][1]&&!sameKind.includes(r)));
  let opts=uniq([roman,...shuf(sameKind),...rest]).slice(0,4);
  opts=shuf(opts.includes(roman)?opts:[roman,...opts.slice(0,3)]);
  return{type:'single',answer:roman,options:shuf(opts),
    tag:`${keyRoot} ${minor?'단조':'장조'}에서 이 코드는?`, main:chord,
    staff:[chordSteps(deg,CH[kind].iv)],
    expl:`${keyRoot} ${minor?'단조':'장조'} 음계에서 ${deg}은 <b>${i+1}번째 음</b>, 그 위로 3도씩 쌓으면 ${chord} = <b>${roman}</b>.`+
      (harmonic?'<br>화성단조는 7음을 반음 올려 <b>이끔음</b>을 만들기 때문에 V가 Vm7이 아니라 <b>V7</b>이 됩니다.':
       minor?'<br>자연단조의 V는 Vm7이라 해결감이 약합니다. 그래서 화성단조의 V7을 자주 빌려 씁니다.':'')};

G.shell=()=>{
  const k=rnd(['maj7','dom7','min7','m7b5','mMaj7','dom9','min9','maj9','dom13','dom7b9']);
  const root=pickRoot(ROOTS,[k]);
  const g=CH[k].iv.find(x=>x[0]===3), s=CH[k].iv.find(x=>x[0]===7);
  const three=nm(addIv(P(root),3,g[1])), seven=nm(addIv(P(root),7,s[1]));
  const guideOnly=Math.random()<.45;
  const ans=guideOnly?[three,seven]:[root,three,seven];
  const chordTones=CH[k].iv.map(([n,q])=>nm(addIv(P(root),n,q)));
  const distr=chordTones.filter(x=>!ans.includes(x));
  const shellIv=guideOnly?[[3,g[1]],[7,s[1]]]:[[1,'P'],[3,g[1]],[7,s[1]]];
  return{type:'multi',need:ans.length,answer:ans,options:shuf(uniq([...ans,...distr.slice(0,4)])),
    tag:guideOnly?'가이드톤 고르기':'셸 보이싱 고르기 (R-3-7)',
    main:symOf(root,k), sub:CH[k].omit||'', hint:ans.length+'개 선택',
    staff:[chordSteps(root,CH[k].iv)],
    staffAns:[chordSteps(root,CH[k].iv,shellIv.map(x=>x[0]))],
    expl:`${symOf(root,k)}의 3음은 <b>${three}</b>, 7음은 <b>${seven}</b>.<br><b>가이드톤</b>(3·7음)만으로 메이저/마이너/도미넌트 성격이 결정되고, 완전5음은 색을 거의 바꾸지 않아 가장 먼저 생략합니다. 오선보에서 밝게 표시된 음이 정답입니다.`};
};

G.name=()=>{
  const pool=['maj7','dom7','min7','m7b5','dim7','six','min9','add9','sus4','aug','mMaj7','maj9','dom9','m6','six9','dom7s9','maj','min','dim','madd9','sus2','min11','dom13',
    'add11','madd11','m7add11','dom7add11','dom7sus4','sus2a13','m7b13'];
  const k=rnd(pool), root=pickRoot(ROOTS,[k]);
  const tones=tonesOf(root,k), correct=symOf(root,k);
  const sameSet=t=>t.length===tones.length&&t.every(x=>tones.includes(x));
  const cands=pool.filter(x=>x!==k&&clean(root,x)&&!sameSet(tonesOf(root,x)));
  const diffCount=x=>{const t=tonesOf(root,x);return t.filter(n=>!tones.includes(n)).length+tones.filter(n=>!t.includes(n)).length};
  const close=shuf(cands.filter(x=>CH[x].iv.length===CH[k].iv.length&&diffCount(x)<=2));
  const mid=shuf(cands.filter(x=>!close.includes(x)&&diffCount(x)<=3));
  const wrong=uniq([...close,...mid,...shuf(cands)]).slice(0,3).map(x=>symOf(root,x));
  const alt=(k==='min7')?`같은 네 음을 ${nm(addIv(P(root),3,'m'))}6으로도 읽을 수 있습니다. <b>어느 음이 근음이냐</b>에 따라 이름이 갈립니다.`
    :(k==='six')?`같은 네 음이 ${nm(addIv(P(root),6,'M'))}m7이기도 합니다. 베이스에 ${root}이 있으면 ${correct}으로 읽습니다.`
    :(k==='m7b5')?`${nm(addIv(P(root),3,'m'))}m6과 구성음이 같습니다.`:'';
  return{type:'single',answer:correct,options:shuf(uniq([correct,...wrong])),
    tag:'이 코드의 이름은?', notes:tones,
    staff:[chordSteps(root,CH[k].iv)],
    expl:`근음 ${root} 기준으로 ${CH[k].iv.map(([n,q])=>degLabel(n,q)).join('-')} → <b>${correct}</b> (${CH[k].ko}).<br>${alt}`};
};

const CLEF_FONT='"Apple Symbols","Segoe UI Symbol","Noto Music","Noto Sans Symbols 2","Symbola",serif';
let CLEF=null;
function clefMetrics(){
  if(CLEF)return CLEF;
  try{
    const c=document.createElement('canvas').getContext('2d');
    c.font='100px '+CLEF_FONT;
    const m=c.measureText('\u{1D11E}'), t=c.measureText('\u{FFFF}');
    const a=m.actualBoundingBoxAscent, d=m.actualBoundingBoxDescent;
    const ok=Math.abs(m.width-t.width)>0.5 && a>0 && d>=0 && (a+d)>30 && m.width>8;
    CLEF=ok?{ok:true,h:(a+d)/100,asc:a/100,w:m.width/100}:{ok:false};
  }catch(e){CLEF={ok:false}}
  return CLEF;
}
const SP=11, TOP=46;
const yOf=s=>TOP+(10-s)*(SP/2);
const NRX=6.6, NRY=4.9;

function staffSVG(groups){
  const cm=clefMetrics();
  // 음자리표: 글자 크기를 재서 G선(아래에서 둘째 줄)에 정확히 맞춘다
  let clefMark='', clefW;
  const topTarget=TOP-SP*1.05, hTarget=SP*6.9;
  if(cm.ok){
    const size=hTarget/cm.h, baseY=topTarget+cm.asc*size;
    clefW=cm.w*size;
    clefMark=`<text x="10" y="${baseY.toFixed(1)}" font-size="${size.toFixed(1)}" fill="rgba(255,255,255,.88)" font-family=${JSON.stringify(CLEF_FONT)}>\u{1D11E}</text>`;
  }else{
    clefW=SP*2.3;
    clefMark=`<text x="12" y="${(TOP+3*SP+SP*0.35).toFixed(1)}" font-size="${(SP*2.6).toFixed(1)}" font-style="italic" font-weight="600" font-family="Georgia,'Times New Roman',serif" fill="rgba(255,255,255,.85)">G</text>`;
  }

  // 각 그룹의 임시표 열과 2도 밀어내기를 먼저 계산한다
  const plan=groups.map(g=>{
    const notes=[...g].sort((a,b)=>a.step-b.step);
    const disp=[];
    notes.forEach((n,i)=>{disp[i]=(i>0&&notes[i].step-notes[i-1].step===1&&!disp[i-1])?1:0});
    const cols=[]; const acc=[];
    [...notes].map((n,i)=>({n,i})).reverse().forEach(({n,i})=>{
      if(n.a===0)return;
      let c=0; while(cols[c]&&cols[c].some(st=>Math.abs(st-n.step)<6))c++;
      (cols[c]=cols[c]||[]).push(n.step);
      acc.push({i,col:c});
    });
    return {notes,disp,acc,nAccCols:cols.length,anyDisp:disp.some(Boolean)};
  });
  const accCols=Math.max(0,...plan.map(p=>p.nAccCols));
  const accW=accCols?accCols*11+4:0;
  const X0=10+clefW+SP*0.9+accW;
  const STEPX=Math.max(...plan.map(p=>p.anyDisp?56:44));
  const width=Math.max(200,X0+groups.length*STEPX+16);
  const allSteps=groups.flat().map(n=>n.step);
  const H=Math.max(132,Math.ceil(yOf(Math.min(...allSteps))+15));

  let s=`<svg class="staff" viewBox="0 0 ${Math.round(width)} ${H}" xmlns="http://www.w3.org/2000/svg">`;
  for(let i=0;i<5;i++){const y=TOP+i*SP;
    s+=`<line x1="8" y1="${y}" x2="${Math.round(width)-8}" y2="${y}" stroke="rgba(255,255,255,.32)" stroke-width="1"/>`}
  s+=clefMark;

  plan.forEach((p,gi)=>{
    const x=X0+gi*STEPX+8;
    const led=new Set();
    p.notes.forEach(n=>{
      if(n.step>10)for(let e=12;e<=n.step;e+=2)led.add(e);
      if(n.step<2)for(let e=0;e>=n.step;e-=2)led.add(e);
    });
    const rightMost=p.anyDisp?x+2*NRX:x;
    led.forEach(e=>{const y=yOf(e);
      s+=`<line x1="${(x-NRX*2).toFixed(1)}" y1="${y}" x2="${(rightMost+NRX*2).toFixed(1)}" y2="${y}" stroke="rgba(255,255,255,.42)" stroke-width="1"/>`});
    p.acc.forEach(({i,col})=>{
      const n=p.notes[i], y=yOf(n.step);
      s+=`<text x="${(x-NRX-7-col*11).toFixed(1)}" y="${(y+5.5).toFixed(1)}" font-size="16" text-anchor="middle" fill="${n.hl?'#3ED6B5':'rgba(255,255,255,.9)'}" font-family=${JSON.stringify(CLEF_FONT)}>${accStr(n.a)}</text>`;
    });
    p.notes.forEach((n,i)=>{
      const y=yOf(n.step), cx=x+(p.disp[i]?2*NRX:0);
      s+=`<ellipse cx="${cx.toFixed(1)}" cy="${y}" rx="${NRX}" ry="${NRY}" transform="rotate(-18 ${cx.toFixed(1)} ${y})" `
       + (n.hl?`fill="#3ED6B5" stroke="#3ED6B5"`:`fill="rgba(255,255,255,.07)" stroke="rgba(255,255,255,.92)"`)
       + ` stroke-width="1.8"/>`;
    });
  });
  return s+'</svg>';
}

const scaleNotes=(r,k)=>SCALES[k].iv.map(([n,q])=>nm(addIv(P(r),n,q)));
const scaleClean=(r,k)=>SCALES[k].iv.every(([n,q])=>Math.abs(addIv(P(r),n,q).a)<=1);
function scaleSteps(r,k,hl){
  const ro=P(r), base=pickBase(ro.l,6);
  return SCALES[k].iv.map(([n,q])=>{

G.scale=()=>{
  const keys=Object.keys(SCALES);
  const mode=rnd(['name','note','chord','mark']);
  if(mode==='name'){
    let k,r,t=0; do{k=rnd(keys);r=rnd(EASY);t++}while(!scaleClean(r,k)&&t<40);
    const same=shuf(keys.filter(x=>x!==k&&SCALES[x].iv.length===SCALES[k].iv.length));
    const other=shuf(keys.filter(x=>x!==k&&!same.includes(x)));
    const wrong=[...same,...other].slice(0,3);
    return{type:'single',answer:SCALES[k].t,options:shuf(uniq([SCALES[k].t,...wrong.map(x=>SCALES[x].t)])),
      tag:`${r}에서 시작하는 이 스케일은?`, staff:scaleSteps(r,k),
      expl:`${r} ${SCALES[k].t} <span class="en">${SCALES[k].en}</span> = ${scaleNotes(r,k).join(' ')}<br>특징음: <b>${SCALES[k].mark}</b>`};
  }
  if(mode==='note'){
    let k,r,t=0; do{k=rnd(keys);r=rnd(EASY);t++}while(!scaleClean(r,k)&&t<40);
    const spec=rnd(SCALES[k].iv.filter(x=>x[0]>1));
    const note=nm(addIv(P(r),spec[0],spec[1])), lab=degLabel(spec[0],spec[1]);
    const near=SCALES[k].iv.map(([n,q])=>nm(addIv(P(r),n,q))).filter(x=>x!==note);
    return{type:'single',answer:note,options:shuf(uniq([note,...shuf(near).slice(0,3)])),
      tag:`${r} ${SCALES[k].t}의 ${lab}음은?`, staff:scaleSteps(r,k,spec[0]),
      expl:`${r} ${SCALES[k].t} = ${scaleNotes(r,k).join(' ')}<br>${lab}음은 <b>${note}</b>입니다.`};
  }
  if(mode==='chord'){
    const k=rnd(['ion','dor','phr','lyd','mix','aeo','loc']);
    const r=rnd(EASY), ck=SCALES[k].chord;
    const wrongs=shuf(['ion','dor','phr','lyd','mix','aeo','loc'].filter(x=>x!==k)).slice(0,3);
    return{type:'single',answer:SCALES[k].t,options:shuf(uniq([SCALES[k].t,...wrongs.map(x=>SCALES[x].t)])),
      tag:'이 코드에 가장 잘 맞는 스케일은?', main:symOf(r,ck), sub:'특징음을 떠올려 보세요',
      staffAns:scaleSteps(r,k),
      expl:`${symOf(r,ck)}에는 <b>${SCALES[k].t}</b>가 어울립니다. 코드음 ${tonesOf(r,ck).join(' ')}을 모두 품고, 특징음 <b>${SCALES[k].mark}</b>이 색을 만듭니다.`};
  }
  const k=rnd(['dor','phr','lyd','mix','aeo','loc']);
  const opts=uniq(['♯11','♭9','♭7','♮13','♭13','♭5']);
  return{type:'single',answer:SCALES[k].mark,options:shuf(uniq([SCALES[k].mark,...shuf(opts.filter(x=>x!==SCALES[k].mark)).slice(0,3)])),
    tag:`${SCALES[k].t}의 특징음은?`, main:SCALES[k].en, sub:'메이저·마이너와 갈리는 한 음',
    staffAns:scaleSteps('C',k),

};

const MAJDEG=[[1,'P'],[2,'M'],[3,'M'],[4,'P'],[5,'P'],[6,'M'],[7,'M']];

   <table><tr><th>순서</th><th>생략</th><th>이유</th></tr>
   <tr><td>1</td><td>완전5음</td><td>색을 바꾸지 않음</td></tr>
   <tr><td>2</td><td>근음</td><td>베이스가 대신 쳐줌</td></tr>
   <tr><td>3</td><td>13 코드의 11</td><td>3음과 충돌</td></tr></table>
   <p>단 <b>3음과 7음은 절대 생략하지 않습니다.</b> 코드의 정체가 사라지기 때문입니다. ♭5·♯5처럼 변화된 5음도 생략할 수 없습니다.</p>`},

  {id:'diatonic',ic:IC.diatonic,cls:'i4',tt:'다이아토닉 도수',gen:G.diatonic,
   cTitle:'다이아토닉 코드 <span class="en">Diatonic Chords</span>',
   c:()=>`<p class="lead">한 음계 안의 음만으로 쌓은 코드들입니다.</p>
   <p>장음계는 <b>온–온–반–온–온–온–반</b> 간격으로 이루어집니다. 이 일곱 음 위에 각각 3도씩 쌓으면 그 조에서 쓸 수 있는 코드 일곱 개가 전부 나옵니다.</p>
   ${figStaff([cs('C','maj7'),cs('D','min7'),cs('E','min7'),cs('F','maj7')],'C장조 — Imaj7 · IIm7 · IIIm7 · IVmaj7')}
   ${figStaff([cs('G','dom7'),cs('A','min7'),cs('B','m7b5')],'V7 · VIm7 · VIIm7♭5')}
   <p>어느 조로 옮겨도 순서는 같습니다. <b>maj7 · m7 · m7 · maj7 · 7 · m7 · m7♭5</b>. 특히 도미넌트 7th는 <b>V 자리에만</b> 나온다는 점이 중요합니다. 곡 안에서 7th 코드를 만나면 그 조의 5도임을 짐작할 수 있습니다.</p>

   <h4>로마숫자 읽는 법</h4>
   <table><tr><th>표기</th><th>뜻</th></tr>
   <tr><td>I · IV · V</td><td>대문자 — 메이저 계열</td></tr>
   <tr><td>ii · iii · vi</td><td>소문자 — 마이너 계열</td></tr>
   <tr><td>vii° · ø</td><td>감3화음 · 하프디미니시드</td></tr>
   <tr><td>♭III · ♭VII</td><td>장음계보다 반음 낮은 자리</td></tr></table>

   <h4>세 가지 기능</h4>
   <table><tr><th>기능</th><th>코드</th><th>느낌</th></tr>
   <tr><td>토닉<span class="en"> T</span></td><td>I · IIIm · VIm</td><td>안정. 끝나는 자리</td></tr>
   <tr><td>서브도미넌트<span class="en"> SD</span></td><td>IIm · IV</td><td>떠남. 부풀어 오름</td></tr>
   <tr><td>도미넌트<span class="en"> D</span></td><td>V · VIIm♭5</td><td>긴장. 돌아가고 싶음</td></tr></table>
   <p>같은 기능끼리는 서로 바꿔 쓸 수 있습니다. I 대신 VIm을 쓰면 끝나는 느낌을 흐릴 수 있고, IV 대신 IIm을 쓰면 더 부드럽게 이어집니다. 이것을 <b>대리코드</b>라고 합니다.</p>
   <p>진행의 기본 뼈대는 <b>T → SD → D → T</b>입니다. II–V–I이 가장 강력한 이유는 도미넌트 안의 트라이톤이 반음으로 좁혀지며 토닉에 풀리기 때문입니다.</p>

   <h4>단조 세 가지</h4>
   <p>장조의 6번째 음에서 시작하면 <b>나란한 단조</b>가 됩니다. C장조와 A단조는 조표가 같습니다.</p>
   ${figStaff([cs('E','min7'),cs('E','dom7',[3])],'A단조의 V — Em7 (자연단조) · E7 (화성단조)')}
   <table><tr><th>단조</th><th>특징</th><th>V의 모습</th></tr>
   <tr><td>자연단조</td><td>조표 그대로</td><td>Vm7 — 해결감 약함</td></tr>
   <tr><td>화성단조</td><td>7음을 반음 올림</td><td><b>V7</b> — 이끔음 생김</td></tr>
   <tr><td>가락단조</td><td>6·7음을 함께 올림</td><td>V7 — 멜로디가 매끄러움</td></tr></table>
   <p>7음을 반음 올리면 으뜸음 바로 아래 반음이 생깁니다. 이 음이 <b>이끔음</b><span class="en"> leading tone</span>이고, 으뜸음으로 끌려가는 힘을 만듭니다. 대신 화성단조에서는 6음과 7음 사이가 증2도로 벌어져 멜로디가 어색해지는데, 이를 피하려고 6음까지 올린 것이 가락단조입니다.</p>
   <p>자연단조의 일곱 코드는 <b>Im7 · IIm7♭5 · ♭IIImaj7 · IVm7 · Vm7 · ♭VImaj7 · ♭VII7</b>이며, 실제 곡에서는 V 자리만 화성단조에서 빌려 V7으로 쓰는 경우가 많습니다.</p>`},

  {id:'shell',ic:IC.shell,cls:'i5',tt:'셸 · 가이드톤',gen:G.shell,
   cTitle:'셸 보이싱 <span class="en">Shell Voicing</span>',
   c:()=>`<p class="lead">코드의 성격은 <b>3음과 7음</b> 두 개가 결정합니다.</p>

   <p>3음이 장인지 단인지, 7음이 장인지 단인지. 이 두 갈래의 조합만으로 네 가지 7화음이 전부 구분됩니다.</p>

   <p>완전5음은 이 판단에 아무 역할도 하지 않습니다. 그래서 가장 먼저 생략합니다.</p>

   <h4>셸 보이싱</h4>
   <p>가이드톤에 근음을 더한 <b>R-3-7</b> 또는 <b>R-7-3</b> 세 음짜리 보이싱입니다. 음이 적은데도 코드가 또렷해서 왼손 반주와 기타 컴핑<span class="en"> comping</span>의 기본형으로 씁니다.</p>
   <div class="figrow">${fig(fretSVG([8,null,9,9,null,null]),'Cmaj7 · R-7-3')}${fig(fretSVG([8,null,8,9,null,null]),'C7 · R-♭7-3')}</div>

   <h4>가이드톤은 반음으로 이어진다</h4>
   ${figStaff([cs('D','min7',[3,7]),cs('G','dom7',[3,7]),cs('C','maj7',[3,7])],'Dm7 (F·C) → G7 (F·B) → Cmaj7 (E·B)')}
   <p>Dm7의 7음 C는 G7의 3음 B로 반음 내려가고, G7의 7음 F는 Cmaj7의 3음 E로 반음 내려갑니다. 손가락이 거의 움직이지 않는데도 화성은 또렷하게 진행합니다. 이 <b>부드러운 성부 연결</b><span class="en"> voice leading</span>이 좋은 보이싱의 핵심입니다.</p>

   <h4>중복과 생략</h4>
   <table><tr><th>상황</th><th>원칙</th></tr>
   <tr><td>중복</td><td>근음 우선, 다음은 5음. <b>3음 중복은 피함</b></td></tr>
   <tr><td>생략</td><td>5음 → 근음 순. 3음·7음은 생략 불가</td></tr>
   <tr><td>변화된 5음</td><td>♭5·♯5는 코드의 색이므로 생략 불가</td></tr></table>
   <p>3음을 중복하면 장단의 색이 지나치게 두꺼워지고, 특히 이끔음이 겹치면 진행이 어색해집니다.</p>

   <h4>자리 배치</h4>
   <p>모든 음이 한 옥타브 안에 모이면 <b>클로즈 포지션</b><span class="en"> close</span>, 벌어지면 <b>오픈 포지션</b><span class="en"> open</span>입니다. 클로즈는 단단하고 오픈은 넓게 퍼집니다.</p>
   <p>클로즈에서 위에서 두 번째 음을 한 옥타브 내리면 <b>드롭2</b>, 세 번째 음을 내리면 <b>드롭3</b>가 됩니다. 기타와 피아노에서 가장 많이 쓰는 오픈 보이싱 만드는 법입니다.</p>

   <h4>성부진행의 금기</h4>
   <ul>
     <li><b>병행 5도·8도</b> — 두 성부가 완전5도나 옥타브 간격을 유지한 채 같은 방향으로 움직이면 성부의 독립성이 사라집니다</li>
     <li><b>숨은 5도·8도</b> — 바깥 성부(베이스와 소프라노)가 같은 방향으로 도약해 완전음정에 도달하는 것도 피합니다</li>
     <li>성부는 가장 가까운 음으로 움직이고, 공통음은 같은 성부에 그대로 둡니다</li>
   </ul>`},

  {id:'name',ic:IC.name,cls:'i6',tt:'코드 이름',gen:G.name,
   cTitle:'코드 심볼 읽기 <span class="en">Chord Symbols</span>',
   c:()=>`<p class="lead">심볼은 <b>근음 → 3음의 성격 → 7음 → 텐션</b> 순으로 읽습니다.</p>
   <p>예를 들어 <b>C m 7 (♭5)</b>는 근음 C, 3음이 단3도, 7음이 단7도, 5음을 반음 내림으로 읽습니다. 순서가 정해져 있어서 앞에서부터 차례로 해석하면 됩니다.</p>
   <table><tr><th>기호</th><th>뜻</th></tr>
   <tr><td>m</td><td>3음이 단3도</td></tr>
   <tr><td>maj7 · △</td><td>장7음</td></tr>
   <tr><td>7</td><td>단7음</td></tr>
   <tr><td>dim · °</td><td>단3 + 감5 (dim7은 감7음까지)</td></tr>

   <tr><td>ø</td><td>m7♭5와 같음</td></tr>
   <tr><td>sus4 · sus2</td><td>3음 대신 4음 · 2음</td></tr>
   <tr><td>add9</td><td>7음 없이 9음만 추가</td></tr>
   <tr><td>6 · 6/9</td><td>7음 대신 6음 · 6음과 9음</td></tr>
   <tr><td>alt</td><td>알터드 텐션을 모아 쓴 도미넌트</td></tr></table>

   <h4>괄호 안은 변화, 밖은 추가</h4>
   <p>C7(♭9)는 이미 있는 9음을 반음 내린 것이고, Cadd9는 없던 9음을 더한 것입니다. 괄호가 붙으면 원래 있어야 할 음이 변형됐다는 신호입니다.</p>

   <h4>구성음이 같은 코드</h4>
   ${figStaff([cs('C','six'),cs('A','min7')],'C6와 Am7 — 네 음이 완전히 같습니다')}
   <p>C·E·G·A는 C6이기도 하고 Am7이기도 합니다. 무엇이 <b>근음</b>이냐, 즉 베이스가 무엇이고 어느 조성 안에 있느냐로 이름이 갈립니다. 같은 관계가 Cm7♭5와 E♭m6 사이에도 성립합니다.</p>
   <p>dim7은 더 극단적입니다. 단3도로 균등하게 쌓여 있어 네 음 중 어느 것을 근음으로 봐도 같은 소리가 납니다. Cdim7 · E♭dim7 · G♭dim7 · A♭♭dim7이 모두 같은 건반을 누릅니다.</p>

   <h4>자리바꿈</h4>
   <table><tr><th>맨 아래 음</th><th>이름</th></tr>
   <tr><td>근음</td><td>기본위치<span class="en"> root position</span></td></tr>
   <tr><td>3음</td><td>제1자리바꿈</td></tr>
   <tr><td>5음</td><td>제2자리바꿈</td></tr>
   <tr><td>7음</td><td>제3자리바꿈</td></tr></table>
   <p>베이스를 따로 지정할 때는 <b>C/E</b>처럼 슬래시로 적습니다. 베이스가 코드에 없는 음일 수도 있습니다. 베이스를 순차로 움직이면 진행이 훨씬 매끄러워지기 때문에, 자리바꿈은 장식이 아니라 성부 연결의 수단입니다.</p>

   <h4>표기가 곧 기능이다</h4>
   <p>D♯과 E♭은 같은 건반이지만 아무렇게나 적으면 안 됩니다. 그 음이 어느 조에서 왔고 어디로 해결되는지가 표기에 드러나기 때문입니다. 올라가는 이끔음이면 ♯, 내려가는 경과음이면 ♭으로 적는 것이 원칙입니다.</p>`}
];
G.openv=()=>{
  const o=rnd(OPENV);
  const lbl=x=>x.name+(x.slash&&CH[x.k].sym.includes('/')?` (bass ${x.bass})`:'');
  const tones=openTones(o);
  const roles=`1번줄 개방 E = <b>${o.degE}</b>, 2번줄 개방 B = <b>${o.degB}</b>`;
  const body=`${lbl(o)} = ${tones.map(t=>t.x+'('+t.d+')').join(' · ')}<br>${roles}<br>
    같은 모양을 프렛만 옮기면 개방현 B·E가 매번 다른 도수로 얹혀 다른 코드가 됩니다.`;
  if(Math.random()<.5){
    const pool=OPENV.filter(x=>x.fam===o.fam&&x.name!==o.name);
    const opts=shuf(uniq([lbl(o),...shuf(pool).map(lbl)])).slice(0,4);
    if(!opts.includes(lbl(o)))opts[0]=lbl(o);
    return{type:'single',answer:lbl(o),options:shuf(opts),
      tag:'이 운지의 코드는?', fret:o.frets, sub:o.famT,
      staffAns:voicingStaff(o), expl:body};
  }
  const ans=`B=${o.degB} · E=${o.degE}`;
  const others=uniq(OPENV.map(x=>`B=${x.degB} · E=${x.degE}`)).filter(x=>x!==ans);
  return{type:'single',answer:ans,options:shuf(uniq([ans,...shuf(others).slice(0,3)])),
    tag:'개방현 B·E는 몇 번 음?', main:lbl(o), fret:o.frets, sub:o.famT,
    staffAns:voicingStaff(o), expl:body};
};
MODES.push({id:'openv',ic:IC.openv,cls:'i7',tt:'개방현 보이싱',gen:G.openv,
  cTitle:'개방현 보이싱 <span class="en">Open-string Voicings</span>',
  c:()=>{
    const p=n=>OPENV.find(o=>o.name===n)||OPENV[0];
    return `<p class="lead">1번줄(E)과 2번줄(B)을 <b>개방</b>으로 두고, 6~3번줄만 통째로 옮기는 주법입니다.</p>
    <div class="figrow">
      ${fig(fretSVG([null,3,5,5,0,0]),'3프렛 · Cmaj7')}
      ${fig(fretSVG([null,5,7,7,0,0]),'5프렛 · Dsus2(add13)')}
      ${fig(fretSVG([null,10,12,12,0,0]),'10프렛 · G6')}
    </div>
    <p>왼손 모양은 하나뿐인데 코드가 전혀 다릅니다. 짚는 세 음은 <b>근음과 5도</b>뿐이고, 색을 결정하는 3음·7음·텐션은 전부 개방현 B와 E가 맡기 때문입니다.</p>

    <h4>같은 모양, 다른 도수</h4>
    <table><tr><th>프렛</th><th>B는</th><th>E는</th><th>코드</th></tr>
    <tr><td>0</td><td>9음</td><td>5음</td><td>Asus2</td></tr>
    <tr><td>2</td><td>R</td><td>4음</td><td>Bsus4</td></tr>
    <tr><td>3</td><td>7음</td><td>3음</td><td>Cmaj7</td></tr>
    <tr><td>4</td><td>7음</td><td>♭3음</td><td>C♯m7</td></tr>
    <tr><td>5</td><td>13음</td><td>9음</td><td>Dsus2(add13)</td></tr>
    <tr><td>10</td><td>3음</td><td>6음</td><td>G6</td></tr></table>
    ${figStaff([voicingStaff(p('Cmaj7'))[0],voicingStaff(p('Dsus2(add13)'))[0],voicingStaff(p('G6'))[0]],'밝게 표시된 음이 개방현 B·E')}
    <p>손가락은 근음만 옮기는데 개방현이 알아서 <b>텐션</b> 역할을 맡습니다. 세 손가락으로 maj7과 6/9 같은 화음이 나오는 이유입니다.</p>

    <h4>왜 넓게 울리나</h4>
    <p>개방현은 손가락으로 누른 음보다 길게 울립니다. 또 짚는 음은 낮은 줄, 울리는 텐션은 높은 줄에 놓이기 때문에 자연스럽게 <b>오픈 포지션</b>이 됩니다. 음 사이가 벌어질수록 탁함이 줄고 공간감이 생깁니다.</p>

    <h4>안 되는 자리도 있다</h4>

let NOTE_SOUND='piano', nCtx=null;
const midiOf=n=>60+Math.floor(n.step/7)*12+BASE[n.l]+n.a;
function audioCtx(){
  if(!nCtx)nCtx=new (window.AudioContext||window.webkitAudioContext)();
  if(nCtx.state==='suspended')nCtx.resume();
  return nCtx;
}
function piano(ctx,f,t){
  const out=ctx.createGain(); out.gain.value=0.85; out.connect(ctx.destination);
  const lp=ctx.createBiquadFilter(); lp.type='lowpass';
  lp.frequency.setValueAtTime(Math.min(7000,f*9),t);
  lp.frequency.exponentialRampToValueAtTime(Math.min(2600,f*4),t+0.9);
  lp.connect(out);
  [[1,0.42,1.7,'triangle'],[2,0.14,1.1,'sine'],[3,0.07,0.75,'sine'],[4.02,0.035,0.5,'sine']]
  .forEach(([r,a,d,ty])=>{
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.type=ty; o.frequency.value=f*r;
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(a,t+0.006);
    g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(g); g.connect(lp); o.start(t); o.stop(t+d+0.05);
  });
}
function pluck(ctx,f,t){
  // 카플러스-스트롱: 잡음을 짧은 지연선에 돌려 현의 울림을 만든다
  const sr=ctx.sampleRate, N=Math.max(2,Math.round(sr/f)), len=Math.floor(sr*1.5);
  const buf=ctx.createBuffer(1,len,sr), d=buf.getChannelData(0);
  const ring=new Float32Array(N);
  for(let i=0;i<N;i++)ring[i]=Math.random()*2-1;
  for(let i=1;i<N;i++)ring[i]=ring[i]*0.6+ring[i-1]*0.4; // 픽 소리 완화
  let idx=0,prev=0;
  for(let i=0;i<len;i++){
    const cur=ring[idx];
    d[i]=cur*Math.exp(-i/(sr*0.9));
    ring[idx]=(cur+prev)*0.5*0.9965;
    prev=cur; idx=(idx+1)%N;
  }
  const src=ctx.createBufferSource(); src.buffer=buf;
  const lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=4200;
  const g=ctx.createGain(); g.gain.value=0.5;
  src.connect(lp); lp.connect(g); g.connect(ctx.destination);
  src.start(t);
}
function playMidi(midi,delay){
  if(NOTE_SOUND==='off')return;
  try{
    const ctx=audioCtx(), t=ctx.currentTime+(delay||0);
    const f=440*Math.pow(2,(midi-69)/12);
    (NOTE_SOUND==='guitar'?pluck:piano)(ctx,f,t);
  }catch(e){}
}
function playNoteName(name,staffGroups,delay){
  if(NOTE_SOUND==='off')return;
  let midi=null;
  (staffGroups||[]).forEach(g=>g.forEach(n=>{if(midi===null&&nm(n)===name)midi=midiOf(n)}));
  if(midi===null){
    const m=/^([A-G])(♯|♭)?$/.exec(name);
    if(!m)return;
    midi=60+BASE[L.indexOf(m[1])]+(m[2]==='♯'?1:m[2]==='♭'?-1:0);
  }
  playMidi(midi,delay);
}
function playChordGroup(g,speed){
  if(NOTE_SOUND==='off'||!g)return;
  [...g].sort((a,b)=>a.step-b.step).forEach((n,i)=>playMidi(midiOf(n),i*(speed||0.09)));
}

function detectPitch(raw,sr0){
  // 2배 다운샘플 — 계산량을 1/4로 줄이고 저음 검출 범위를 넓힌다
  const n=raw.length>>1, sr=sr0/2, buf=new Float32Array(n);
  let mean=0;
  for(let i=0;i<n;i++){buf[i]=(raw[2*i]+raw[2*i+1])*0.5;mean+=buf[i];}
  mean/=n;
  let rms=0; for(let i=0;i<n;i++){buf[i]-=mean;rms+=buf[i]*buf[i];}
  rms=Math.sqrt(rms/n);
  if(rms<0.012)return -1;
  const minLag=Math.max(2,Math.floor(sr/1300)), maxLag=Math.min(n-2,Math.floor(sr/35));
  if(maxLag<=minLag)return -1;
  // 정규화 자기상관 (McLeod)
  const nsdf=new Float32Array(maxLag+2);
  for(let lag=minLag;lag<=maxLag;lag++){
    let ac=0,m=0;
    for(let i=0,e=n-lag;i<e;i++){const a=buf[i],b=buf[i+lag];ac+=a*b;m+=a*a+b*b;}
    nsdf[lag]=m>0?2*ac/m:0;
  }
  // 국소 최대점을 모아, 가장 큰 값의 88% 이상인 것 중 "가장 이른" 것을 고른다
  let peaks=[],maxv=0;
  for(let lag=minLag+1;lag<maxLag;lag++){
    if(nsdf[lag]>0&&nsdf[lag]>nsdf[lag-1]&&nsdf[lag]>=nsdf[lag+1]){
      peaks.push(lag); if(nsdf[lag]>maxv)maxv=nsdf[lag];
    }
  }
  if(!peaks.length||maxv<0.62)return -1;
  const thr=maxv*0.88;
  let best=peaks.find(l=>nsdf[l]>=thr);
  if(best===undefined)return -1;
  // 포물선 보간으로 소수점 단위까지
  const x1=nsdf[best-1],x2=nsdf[best],x3=nsdf[best+1];
  const a=(x1+x3-2*x2)/2,b=(x3-x1)/2;
  const T=a?best-b/(2*a):best;
  const f=sr/T;
  return (f>30&&f<1300)?f:-1;
}
function tUpdate(){
  tAna.getFloatTimeDomainData(tBuf);
  const f=detectPitch(tBuf,tCtx.sampleRate);
  if(f>0){
    tHist.push(f); if(tHist.length>5)tHist.shift();
    const sorted=[...tHist].sort((a,b)=>a-b);
    const med=sorted[sorted.length>>1];
    const midi=69+12*Math.log2(med/A4);
    const r=Math.round(midi), cents=Math.round((midi-r)*100);
    const name=NOTE12[((r%12)+12)%12];
    $('tNote').innerHTML=name.length>1?`${name[0]}<small>♯</small>`:name;
    $('tHz').textContent=med.toFixed(1);
    $('tCent').textContent=(cents>0?'+':'')+cents;
    const lock=Math.abs(cents)<=4;
    $('tNote').classList.toggle('lock',lock);
    $('tTri').setAttribute('fill',lock?'#3ED6B5':'rgba(255,255,255,.25)');
    const cl=Math.max(-50,Math.min(50,cents));
    const ang=Math.PI*(1-(cl+50)/100);
    $('tDot').setAttribute('cx',(160+120*Math.cos(ang)).toFixed(1));
    $('tDot').setAttribute('cy',(176-120*Math.sin(ang)).toFixed(1));
    $('tDot').setAttribute('fill',lock?'#3ED6B5':'rgba(255,255,255,.75)');
    let near=-1,bd=1e9;
    INSTS[tInst].s.forEach(([,hz],i)=>{const d=Math.abs(12*Math.log2(med/hz));if(d<bd){bd=d;near=i}});
    renderTunerStatic(bd<1.5?near:-1);
  }else{
    tHist=[];
    $('tNote').classList.remove('lock');
    $('tTri').setAttribute('fill','rgba(255,255,255,.25)');
    $('tDot').setAttribute('fill','rgba(255,255,255,.3)');
  }
  tLoop=setTimeout(()=>requestAnimationFrame(tUpdate),45);
}
async function getMic(){
  // 제약 조건을 단계적으로 낮춰가며 시도 (WebView는 고급 옵션을 거부하는 경우가 있다)
  const tries=[
    {audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}},
    {audio:{echoCancellation:false}},
    {audio:true}
  ];
  let last=null;
  for(const c of tries){
    try{
      if(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)
        return await navigator.mediaDevices.getUserMedia(c);
      const legacy=navigator.getUserMedia||navigator.webkitGetUserMedia||navigator.mozGetUserMedia;
      if(legacy)return await new Promise((res,rej)=>legacy.call(navigator,c,res,rej));
      const e=new Error('NO_MEDIA_API'); e.name='NoApi'; throw e;
    }catch(e){
      last=e;
      if(e&&e.name==='NoApi')throw e;
      if(e&&e.name==='NotAllowedError')throw e;
    }
  }
  throw last||new Error('unknown');
}

const SIGS=[['2/4',2,[2,0]],['3/4',3,[2,0,0]],['4/4',4,[2,0,1,0]],['5/4',5,[2,0,0,1,0]],
  ['6/4',6,[2,0,0,1,0,0]],['3/8',3,[2,0,0]],['6/8',6,[2,0,0,1,0,0]],['7/8',7,[2,0,0,1,0,1,0]],

let BPM=120, BEATS=4, SIG='4/4', ACC=[2,0,1,0], mOn=false, mCtx=null, mNextT=0, mBeat=0, mTimer=null, mQueue=[], mTaps=[];
const tempoWord=b=>b<60?'Largo':b<76?'Adagio':b<108?'Andante':b<120?'Moderato':b<156?'Allegro':b<176?'Vivace':'Presto';
const ACCNAME=['보통','약센트','강센트'];

  SIG=t; BEATS=f[1]; ACC=f[2].slice(); mBeat=0; renderMetro();

function cycleAcc(i){ACC[i]=(ACC[i]+1)%3;renderMetro();}

const SOUNDS={
  click:{t:'Click', type:'square',   f:[1000,1400,1800], dur:0.028, vol:[.3,.42,.55]},
  tick :{t:'Tick',  noise:true, hp:[3600,4600,5600],     dur:0.016, vol:[.55,.7,.9]},
  wood :{t:'Wood',  type:'triangle', f:[900,1180,1500],  dur:0.03,  vol:[.4,.52,.66], drop:0.55},
  stick:{t:'Stick', noise:true, bp:[2200,2800,3400], q:1.6,dur:0.022, vol:[.5,.65,.85]},
  beep :{t:'Beep',  type:'sine',     f:[880,1174,1568],  dur:0.05,  vol:[.32,.44,.58]},
  pulse:{t:'Pulse', type:'square',   f:[620,820,1040],   dur:0.035, vol:[.26,.36,.48], drop:0.8}

let mSound='click';
function noiseSrc(ctx){
  if(!ctx._nb){
    const n=Math.floor(ctx.sampleRate*0.25);
    ctx._nb=ctx.createBuffer(1,n,ctx.sampleRate);
    const d=ctx._nb.getChannelData(0);
    for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
  }
  const s=ctx.createBufferSource(); s.buffer=ctx._nb; s.loop=true; return s;
}
function click(t,lvl){
  const S=SOUNDS[mSound]||SOUNDS.click;
  const g=mCtx.createGain(), v=S.vol[lvl]||S.vol[0];
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(v,t+0.002);
  g.gain.exponentialRampToValueAtTime(0.0001,t+S.dur);
  g.connect(mCtx.destination);
  const end=t+S.dur+0.02;
  if(S.noise){
    const n=noiseSrc(mCtx), f=mCtx.createBiquadFilter();
    if(S.hp){f.type='highpass';f.frequency.value=S.hp[lvl]||S.hp[0];f.Q.value=0.8;}
    else{f.type='bandpass';f.frequency.value=S.bp[lvl]||S.bp[0];f.Q.value=S.q||3;}
    n.connect(f); f.connect(g); n.start(t); n.stop(end);
    return;
  }
  const o=mCtx.createOscillator();
  o.type=S.type;
  const f0=S.f[lvl]||S.f[0];
  o.frequency.setValueAtTime(f0,t);
  if(S.drop)o.frequency.exponentialRampToValueAtTime(f0*S.drop,t+S.dur);
  o.connect(g); o.start(t); o.stop(end);
}

function tapTempo(){
  const now=performance.now();
  if(mTaps.length&&now-mTaps[mTaps.length-1]>2200)mTaps=[];
  mTaps.push(now);
  if(mTaps.length>5)mTaps.shift();
  if(mTaps.length>=2){
    let sum=0;
    for(let i=1;i<mTaps.length;i++)sum+=mTaps[i]-mTaps[i-1];
    const avg=sum/(mTaps.length-1);
    BPM=Math.min(300,Math.max(30,Math.round(60000/avg)));
    renderMetro();
  }
  $('mTap').textContent=mTaps.length<2?'한 번 더…':'Tap Tempo';
}
