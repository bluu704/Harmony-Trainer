  const staff=(SHOW_STAFF||HIDE_NAMES)&&q.staff?`<div class="staffwrap">${staffSVG(q.staff)}</div>`:'';
  $('qcard').innerHTML=`<div class="qtag">${q.tag}</div>${head}${fret}${q.sub?`<div class="qsub">${q.sub}</div>`:''}${staff}`;
}

function tap(n){
  const q=state.q, btns=[...$('opts').children], b=btns[n];
  if(b.disabled)return;
  if(q.type==='single'){judge(b.dataset.v===q.answer,btns,q,b);return}
  const v=b.dataset.v;
  if(state.sel.includes(v)){state.sel=state.sel.filter(x=>x!==v);b.classList.remove('sel')}
  else{state.sel.push(v);b.classList.add('sel');playNoteName(v,q.staffAns||q.staff)}
  if(state.sel.length===q.need)judge(q.answer.every(a=>state.sel.includes(a)),btns,q);
}

function judge(ok,btns,q,clicked){
  btns.forEach(b=>{
    b.disabled=true; b.classList.remove('sel');
    const v=b.dataset.v, isAns=q.type==='multi'?q.answer.includes(v):v===q.answer;
    if(isAns)b.classList.add('ok');
    else if(q.type==='multi'&&state.sel.includes(v))b.classList.add('no');
    else if(q.type==='single'&&b===clicked)b.classList.add('no');
  });
  if(ok){state.score++;state.streak++;state.bestStreak=Math.max(state.bestStreak,state.streak)}
  else{state.streak=0;state.wrongs.push(q)}
  $('streak').textContent=state.streak;
  sheetMode='quiz'; state.awaiting=true;
  const sh=$('sheet');
  sh.classList.remove('ok','no'); sh.classList.add(ok?'ok':'no');
  $('vdot').textContent=ok?'✓':'✕';
  $('vtext').textContent=ok?rnd(['정답','좋아요','통과']):'다시 보기';
  $('expl').innerHTML=q.expl;
  const sd=q.staffAns||q.staff;
  $('staffBox').innerHTML=(SHOW_STAFF||HIDE_NAMES)&&sd?staffSVG(sd):'';
  if(sd&&sd.length===1&&sd[0].length>1)playChordGroup(sd[0],0.075);
  requestAnimationFrame(()=>sh.classList.add('up'));
  state.i++;
}
$('nextBtn').onclick=()=>{
  if(sheetMode==='concept'){sheetMode='quiz';$('sheet').classList.remove('up');$('scrim').classList.remove('on');return}
  state.awaiting=false;
  $('sheet').classList.remove('up');
  setTimeout(nextQ,160);
};

function finish(){
  $('fill').style.width='100%';
  go('result');
  const s=state.score;
  best[state.mode.id]=Math.max(best[state.mode.id]||0,s);
  $('rnum').textContent=s;
  $('rmode').textContent=state.mode.tt+' · 10문제';
  $('rtitle').textContent=s>=9?'거의 완벽합니다':s>=7?'감이 잡혔네요':s>=4?'조금만 더':'개념 설명부터 훑어보세요';
  $('rAcc').textContent=(s*10)+'%';
  $('rStreak').textContent=state.bestStreak;
  setTimeout(()=>{$('arc').style.strokeDashoffset=415-(415*s/10)},80);
  const w=state.wrongs;
  $('review').classList.toggle('hidden',w.length===0);
  $('reviewList').innerHTML=w.map(q=>`<div><em>${q.notes?q.notes.join(' '):q.main}</em> — 정답 ${Array.isArray(q.answer)?q.answer.join(' '):q.answer}</div>`).join('');
  renderHome();
}

/* ============ 기타 보이싱 ============ */
const OPEN=[40,45,50,55,59,64];
function voicings(root,k,max,opt){
  opt=opt||{};
  const r=P(root);
  const degs=CH[k].iv.map(([n,q])=>({n,pc:pc(addIv(r,n,q))}));
  const pcs=uniq(degs.map(d=>d.pc)), rootPc=pc(r);
  const big=CH[k].iv.length>=5, optional=[];
  if(CH[k].iv.some(x=>x[0]===5&&x[1]==='P'))optional.push(pc(addIv(r,5,'P')));
  if(big&&CH[k].iv.some(x=>x[0]===11&&x[1]==='P'))optional.push(pc(addIv(r,11,'P')));
  const need=degs.filter(d=>!optional.includes(d.pc)).map(d=>d.pc);
  const out=[];
  const check=v=>{
    const played=[]; v.forEach((f,i)=>{if(f!==null)played.push(i)});
    if(played.length<(pcs.length<=2?3:4))return;
    if(played[played.length-1]-played[0]!==played.length-1)return;
    if(pcs.length>2&&played[played.length-1]<4)return;
    const notes=played.map(i=>OPEN[i]+v[i]);
    if(notes[0]%12!==rootPc)return;
    const set=new Set(notes.map(n=>n%12));
    if(!need.every(p=>set.has(p)))return;
    const fr=played.map(i=>v[i]).filter(f=>f>0);
    if(!fr.length)return;
    const lo=Math.min(...fr), hi=Math.max(...fr);
    if(hi-lo>3)return;
    const fingers=1+played.filter(i=>v[i]>lo).length;
    if(fingers>4)return;
    const openCount=played.filter(i=>v[i]===0).length;
    if(opt.open&&(openCount===0||lo>4))return;      // 오픈 폼: 개방현 포함, 낮은 자리
    if(opt.barre&&(openCount>0||lo<1))return;       // 하이 폼: 개방현 없음
    const score=played.length*1.5-lo*1.9-(hi-lo)*1.5-fingers*0.7
      +played.filter(i=>v[i]===0).length*0.9+(set.size===pcs.length?2.5:0);
    out.push({v:v.slice(),score,key:v.map(f=>f===null?'x':f).join('-')});
  };
  for(let f0=0;f0<=9;f0++){
    const per=OPEN.map(o=>{
      const a=[null];
      for(let f=f0;f<=f0+3&&f<=15;f++)if(pcs.includes((o+f)%12))a.push(f);
      if(f0>1&&pcs.includes(o%12)&&!a.includes(0))a.push(0);
      return a;
    });
    const cur=new Array(6);
    (function rec(i){
      if(i===6)return check(cur);
      for(const f of per[i]){cur[i]=f;rec(i+1)}
    })(0);
  }
  const seen=new Set(), res=[];
  out.sort((a,b)=>b.score-a.score).forEach(o=>{if(!seen.has(o.key)){seen.add(o.key);res.push(o)}});
  return res.slice(0,max||3);
}
function fretSVG(v){
  const fr=v.filter(f=>f!==null&&f>0);
  const maxF=fr.length?Math.max(...fr):1, minF=fr.length?Math.min(...fr):1;
  const base=maxF<=4?1:minF;
  const LFT=20, TOPY=24, SW=13.4, FH=17, W=LFT+SW*5+16, H=TOPY+FH*5+8;
  let s=`<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" xmlns="http://www.w3.org/2000/svg">`;
  for(let j=0;j<=5;j++){const y=TOPY+j*FH;
    s+=`<line x1="${LFT}" y1="${y}" x2="${LFT+SW*5}" y2="${y}" stroke="rgba(255,255,255,${j===0&&base===1?'.85':'.28'})" stroke-width="${j===0&&base===1?3:1}"/>`}
  for(let i=0;i<6;i++){const x=LFT+i*SW;
    s+=`<line x1="${x}" y1="${TOPY}" x2="${x}" y2="${TOPY+FH*5}" stroke="rgba(255,255,255,.28)" stroke-width="1"/>`}
  if(base>1)s+=`<text x="${LFT-6}" y="${TOPY+FH*0.74}" font-size="9.5" text-anchor="end" fill="rgba(255,255,255,.55)">${base}</text>`;
  const barre=fr.length&&v.filter(f=>f===minF).length>=3?minF:null;
  if(barre!==null){
    const idx=v.map((f,i)=>f===barre?i:-1).filter(i=>i>=0);
    const x1=LFT+idx[0]*SW, x2=LFT+idx[idx.length-1]*SW, y=TOPY+(barre-base)*FH+FH/2;
    s+=`<rect x="${x1-5}" y="${y-5}" width="${x2-x1+10}" height="10" rx="5" fill="rgba(255,255,255,.92)"/>`;
  }
  v.forEach((f,i)=>{
    const x=LFT+i*SW;
    if(f===null||f===0){
      s+=`<text x="${x}" y="${TOPY-6}" font-size="10" text-anchor="middle" fill="rgba(255,255,255,${f===0?'.8':'.4'})">${f===0?'○':'×'}</text>`;
      return;
    }
    const row=f-base;
    if(row<0||row>4)return;
    s+=`<circle cx="${x}" cy="${TOPY+row*FH+FH/2}" r="5.1" fill="rgba(255,255,255,.92)"/>`;
  });
  return s+'</svg>';
}

/* ============ 개방현 보이싱 (1·2번줄 개방) ============ */
const RECOG=['five','maj','min','sus2','sus4','dim','aug','six','m6','maj7','dom7','min7','m7b5',
  'dim7','mMaj7','dom7sus4','add9','madd9','add11','madd11','sus2a13','sus2a11','six9','maj9',
  'dom9','min9','m7add11','dom7add11','maj7s11','m7b13','maj7a13','min11','dom13','dom7b9','dom7s9','dom7s11','dom7b13'];
const SPELL=['C','C♯','D','E♭','E','F','F♯','G','A♭','A','B♭','B'];
const ALTSP={'C♯':'D♭','E♭':'D♯','F♯':'G♭','A♭':'G♯','B♭':'A♯','D':'D','C':'C','E':'E','F':'F','G':'G','A':'A','B':'B'};
function identify(pcList,bassPc){
  const set=uniq(pcList).sort((a,b)=>a-b);
  let best=null;
  for(let r=0;r<12;r++)for(let ti=0;ti<RECOG.length;ti++){
    const k=RECOG[ti];
    const cp=uniq(CH[k].iv.map(([n,q])=>(pc(addIv({l:0,a:0},n,q))+r)%12)).sort((a,b)=>a-b);
    if(cp.length!==set.length||!cp.every((v,i)=>v===set[i]))continue;
    const sc=(r===bassPc?0:1000)+ti;
    if(!best||sc<best.sc)best={r,k,sc};
  }
  if(!best)return null;
  let root=SPELL[best.r];
  if(!clean(root,best.k)){const b=ALTSP[root];if(b&&clean(b,best.k))root=b;else return null}
  return {root,k:best.k,bassPc,slash:best.r!==bassPc};
}
const GSTR=[40,45,50,55,59,64];
const FAM=[
  {id:'a5',t:'5번 줄 루트',ds:'x · 루트 · 5도 · 루트 · 개방 · 개방',pat:f=>[null,f,f+2,f+2,0,0]},
  {id:'e6M',t:'6번 줄 루트 · 메이저',ds:'E 코드 모양을 3번줄까지만',pat:f=>[f,f+2,f+2,f+1,0,0]},
  {id:'e6m',t:'6번 줄 루트 · 마이너',ds:'Em 코드 모양을 3번줄까지만',pat:f=>[f,f+2,f+2,f,0,0]},
  {id:'inv',t:'5번 줄 베이스 · 전위',ds:'6번줄을 빼면 5도가 베이스로',pat:f=>[null,f+2,f+2,f+1,0,0]}
];
function degOf(root,k,targetPc){
  const hit=CH[k].iv.find(([n,q])=>pc(addIv(P(root),n,q))===targetPc);
  return hit?degLabel(hit[0],hit[1]):'—';
}
const OPENV=[];
FAM.forEach(F=>{
  for(let f=0;f<=12;f++){
    const v=F.pat(f);
    if(v.some(x=>x!==null&&x>15))continue;
    const midis=v.map((x,i)=>x===null?null:GSTR[i]+x).filter(x=>x!==null);
    const id=identify(midis.map(m=>m%12),midis[0]%12);
    if(!id)continue;
    const map={}; CH[id.k].iv.forEach(([n,q])=>{const o=addIv(P(id.root),n,q);map[pc(o)]={o,n,q}});
    if(Object.values(map).some(x=>Math.abs(x.o.a)>1))continue;
    const bassName=nm(map[id.bassPc].o);
    const slashOK=id.slash&&!CH[id.k].sym.includes('/');
    OPENV.push({fam:F.id,famT:F.t,fret:f,frets:v,midis,root:id.root,k:id.k,
      bass:bassName,slash:id.slash,
      name:symOf(id.root,id.k)+(slashOK?'/'+bassName:''),
      degB:degOf(id.root,id.k,11),degE:degOf(id.root,id.k,4)});
  }
});
function voicingStaff(o){
  const map={}; CH[o.k].iv.forEach(([n,q])=>{const x=addIv(P(o.root),n,q);map[pc(x)]=x});
  const out=[];
  o.midis.forEach(m=>{
    const x=map[m%12]; if(!x)return;
    const nat=m+12-x.a, oct=(nat-BASE[x.l])/12-1, step=(oct-4)*7+x.l;
    if(!out.some(y=>y.step===step))out.push({l:x.l,a:x.a,step,hl:m===59||m===64});
  });
  return [out.sort((a,b)=>a.step-b.step)];
}
const openTones=o=>o.midis.map(m=>{
  const map={}; CH[o.k].iv.forEach(([n,q])=>{const x=addIv(P(o.root),n,q);map[pc(x)]=[nm(x),degLabel(n,q)]});
  return {x:map[m%12][0],d:map[m%12][1],open:m===59||m===64};
}).filter((t,i,a)=>a.findIndex(y=>y.x===t.x)===i);

/* ============ 코드 사전 ============ */
const DICT_ORDER=['five','maj','min','dim','aug','sus2','sus4','six','m6','add9','madd9','six9',
  'add11','madd11','sus2a11','sus2a13','maj7','dom7','min7','m7b5','dim7','mMaj7','dom7sus4',
  'maj9','dom9','min9','min11','m7add11','dom7add11','m7b13','maj7a13',
  'dom13','maj7s11','dom7s11','dom7b9','dom7s9','dom7b13'];
let dictRoot='C', dictSel=null;
const normQ=t=>t.trim().replace(/#/g,'♯').replace(/^([A-Ga-g])b/,(m,a)=>a.toUpperCase()+'♭')
  .replace(/^([a-g])/,m=>m.toUpperCase());

const openLabel=o=>o.name+(o.slash&&CH[o.k].sym.includes('/')?` (bass ${o.bass})`:'');
function renderDict(){
  const q=normQ($('q').value);
  $('roots').innerHTML=ROOTS.map(r=>`<button class="press ${r===dictRoot&&!q?'on':''}" onclick="setRoot('${r}')">${r}</button>`).join('')
    +`<button class="press ${dictRoot==='OPEN'&&!q?'on':''}" onclick="setRoot('OPEN')">♪ 개방현</button>`;
  if(!q&&dictRoot==='OPEN'){
    $('clist').className='clist two';
    $('clist').innerHTML=FAM.map(F=>{
      const items=OPENV.filter(o=>o.fam===F.id);
      return `<div class="chead"><b>${F.t}</b> · ${F.ds}</div>`+items.map(o=>{
        const i=OPENV.indexOf(o);
        return `<button class="citem glass press ${dictSel==='o'+i?'on':''}" onclick="showOpen(${i})">${openLabel(o)}<small>${o.fret}프렛</small></button>`;
      }).join('');
    }).join('');
    return;
  }
  $('clist').className='clist';
  let list=[];
  if(q){
    const lq=q.toLowerCase();
    ROOTS.forEach(r=>DICT_ORDER.forEach(k=>{
      if(!clean(r,k))return;
      if(symOf(r,k).toLowerCase().includes(lq))list.push([r,k]);
    }));
    if(!list.length)ROOTS.forEach(r=>DICT_ORDER.forEach(k=>{
      if(clean(r,k)&&CH[k].sym.toLowerCase().includes(lq))list.push([r,k]);
    }));
    list=list.slice(0,45);
  }else{
    DICT_ORDER.forEach(k=>{if(clean(dictRoot,k))list.push([dictRoot,k])});
  }
  $('clist').innerHTML=list.length?list.map(([r,k])=>
    `<button class="citem glass press ${dictSel&&dictSel[0]===r&&dictSel[1]===k?'on':''}" onclick="showChord('${r}','${k}')">${symOf(r,k)}</button>`).join('')
    :`<div class="empty" style="grid-column:1/-1">찾는 코드가 없습니다. C, maj7, F♯m 처럼 입력해 보세요.</div>`;
}
function fretSec(title,sub,list){
  if(!list.length)return '';
  return `<div class="dsec"><h5>${title} <span class="en">${sub}</span></h5>
    <div class="frets">${list.map(o=>`<div class="fretcard">${fretSVG(o.v)}<em>${o.v.map(f=>f===null?'×':f).join(' ')}</em></div>`).join('')}</div></div>`;
}
function showOpen(i){
  const o=OPENV[i]; dictSel='o'+i;
  const tones=openTones(o);
  $('detail').innerHTML=`<div class="detail glass">
    <h2>${openLabel(o)}</h2>
    <div class="kind">${o.famT} · ${o.fret}프렛</div>
    <div class="dsec" style="display:flex;justify-content:center">${fretSVG(o.frets)}</div>
    <div class="kind">${o.frets.map(f=>f===null?'×':f).join(' ')} · 6번줄 → 1번줄</div>
    <div class="dsec"><h5>구성음 <span class="en">chord tones</span> · 민트색이 개방현</h5>
      <div class="tones">${tones.map(t=>`<span class="tone ${t.open?'open':''}"><b>${t.x}</b><span>${t.d}</span></span>`).join('')}</div></div>
    <div class="dsec"><h5>오선보 <span class="en">staff</span> · 실음보다 한 옥타브 높게 표기</h5>${staffSVG(voicingStaff(o))}</div>
    <div class="dsec"><h5>개방현이 맡는 역할</h5>
      <div class="kind" style="text-align:left;color:#C9CCDA">2번줄 B = <b>${o.degB}</b>, 1번줄 E = <b>${o.degE}</b>${o.slash?`<br>베이스가 ${o.bass}이라 전위(분수코드)로 울립니다.`:''}</div></div>
  </div>`;
  renderDict();
  $('detail').scrollIntoView({behavior:'smooth',block:'start'});
}
function setRoot(r){dictRoot=r;$('q').value='';dictSel=null;$('detail').innerHTML='';renderDict()}
function showChord(r,k){
  dictSel=[r,k];
  const tones=CH[k].iv.map(([n,q])=>({d:degLabel(n,q),x:nm(addIv(P(r),n,q))}));
  const vo=voicings(r,k,3,{open:true}), vb=voicings(r,k,3,{barre:true});
  $('detail').innerHTML=`<div class="detail glass">
    <h2>${symOf(r,k)}</h2>
    ${CH[k].omit?`<div class="kind">${CH[k].omit}</div>`:''}
    <div class="dsec"><h5>구성음 <span class="en">chord tones</span></h5>
      <div class="tones">${tones.map(t=>`<span class="tone"><b>${t.x}</b><span>${t.d}</span></span>`).join('')}</div></div>
    <div class="dsec"><h5>오선보 <span class="en">staff</span></h5>${staffSVG([chordSteps(r,CH[k].iv)])}</div>
    ${fretSec('오픈 폼','open position · 개방현 사용',vo)}
    ${fretSec('하이 폼','barre position · 자리 이동 가능',vb)}
    ${(!vo.length&&!vb.length)?`<div class="dsec"><h5>기타 포지션</h5><div class="empty">기타로 잡기 어려운 코드입니다.</div></div>`:''}
  </div>`;
  renderDict();
  $('detail').scrollIntoView({behavior:'smooth',block:'start'});
}
$('q').addEventListener('input',()=>{dictSel=null;$('detail').innerHTML='';renderDict()});
