plugins { id 'com.android.application' }

android {
    namespace 'com.harmony.trainer'
    compileSdk 34

    defaultConfig {
        applicationId "com.harmony.trainer"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "1.5"
    }

    buildTypes {
        release {
            minifyEnabled false
            // 스토어 배포용 서명키가 없으므로 디버그 키로 서명 (개인 설치용)
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions { jniLibs { useLegacyPackaging false } }
}

dependencies {
    // 앱 내부 파일을 https 주소로 서빙하기 위해 필요 (마이크 권한에 필수)
    implementation 'androidx.webkit:webkit:1.11.0'
}
